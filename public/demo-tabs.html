<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>落雲宗・分頁轉場動效範例展示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;500;600;700;900&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@1.41.0/dist/umd/lucide.min.js"></script>

<style>
  :root {
    --ink-0: #101A1E;
    --ink-1: #16242A;
    --ink-2: #1B2C32;
    --mist-1: #EEF5F1;
    --mist-2: #B9CAC3;
    --mist-3: #91A39B;
    --jade-100: #D5E7DC;
    --jade-300: #9BC3AE;
    --jade-500: #6E9E88;
    --jade-700: #3D6555;
    --gold: #C9A961;
    --gold-dim: #8A7440;
    --cinnabar: #D07A6C;
    --amethyst: #9E8FC0;
    --hair: rgba(228,235,232,.10);
    --hair-2: rgba(228,235,232,.18);
    --ease-xianxia: cubic-bezier(0.16, 1, 0.3, 1);
    --anim-speed: 1;
    color-scheme: dark;
  }

  html[data-theme="light"] {
    --ink-0: #E8E0D1;
    --ink-1: #F3EDE1;
    --ink-2: #DED4C3;
    --mist-1: #24382F;
    --mist-2: #4A6056;
    --mist-3: #4F665C;
    --jade-100: #174737;
    --jade-300: #2E7055;
    --jade-500: #477E65;
    --jade-700: #285C48;
    --gold: #8C651C;
    --cinnabar: #A64E41;
    --amethyst: #66558D;
    --hair: rgba(76,65,45,.16);
    --hair-2: rgba(57,82,68,.27);
    color-scheme: light;
  }

  body {
    margin: 0;
    background-color: var(--ink-0);
    color: var(--mist-2);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    transition: background-color .35s var(--ease-xianxia);
  }

  /* 背景圖層 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    background-size: cover;
    background-position: center;
    background-image: url('/assets/yunmeng-dark-v1.jpg');
    transition: background-image .45s ease;
  }
  html[data-theme="light"] body::before {
    background-image: url('/assets/yunmeng-light-v1.jpg');
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(ellipse at 50% 10%, transparent 40%, rgba(10,16,19,.78) 95%);
    pointer-events: none;
  }
  html[data-theme="light"] body::after {
    background: radial-gradient(ellipse at 50% 10%, rgba(247,242,231,.45) 30%, rgba(235,229,212,.75) 95%);
  }

  .disp { font-family: 'Noto Serif TC', serif; }
  .brush { font-family: 'LXGW WenKai TC', 'Noto Serif TC', serif; }
  .surface {
    background: linear-gradient(180deg, rgba(22,36,42,.84), rgba(16,26,30,.88));
    border: 1px solid var(--hair);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 20px 48px -20px rgba(0,0,0,.65);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  html[data-theme="light"] .surface {
    background: linear-gradient(180deg, rgba(247,242,232,.95), rgba(234,225,208,.94));
    border-color: var(--hair);
    box-shadow: inset 0 1px 0 rgba(255,253,247,.8), 0 20px 48px -20px rgba(79,61,35,.32);
  }
  /* ---------------- 全螢幕獨立法術特效層 (Cinematic FX) ---------------- */
  #cinematic-fx {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 100;
    overflow: hidden;
  }

  /* 震屏效果 */
  body.screen-shake {
    animation: screenShake calc(0.38s * var(--anim-speed)) ease-out both;
  }
  @keyframes screenShake {
    0% { transform: translate(0, 0); }
    20% { transform: translate(-5px, 6px); }
    40% { transform: translate(6px, -4px); }
    60% { transform: translate(-3px, 3px); }
    80% { transform: translate(3px, -2px); }
    100% { transform: translate(0, 0); }
  }

  /* 1. 試煉佈告：青竹飛劍凌空破空 */
  .fx-sword-fly-1 {
    position: absolute;
    top: 75vh;
    left: -15vw;
    animation: flySwordAcross1 calc(0.55s * var(--anim-speed)) cubic-bezier(0.12, 0.9, 0.2, 1) both;
    filter: drop-shadow(0 0 16px rgba(127,214,160,0.95)) drop-shadow(0 0 35px #3D6555);
  }
  .fx-sword-fly-2 {
    position: absolute;
    top: 58vh;
    left: -20vw;
    animation: flySwordAcross2 calc(0.58s * var(--anim-speed)) cubic-bezier(0.15, 0.92, 0.22, 1) calc(0.06s * var(--anim-speed)) both;
    filter: drop-shadow(0 0 20px rgba(155,195,174,1)) drop-shadow(0 0 45px #6E9E88);
  }
  .fx-sword-fly-3 {
    position: absolute;
    top: 85vh;
    left: -15vw;
    animation: flySwordAcross3 calc(0.52s * var(--anim-speed)) cubic-bezier(0.1, 0.88, 0.18, 1) calc(0.12s * var(--anim-speed)) both;
    filter: drop-shadow(0 0 14px rgba(201,255,224,0.85));
  }
  @keyframes flySwordAcross1 {
    0% { transform: translate(0, 0) rotate(-32deg); opacity: 0; }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translate(130vw, -85vh) rotate(-32deg); opacity: 0; }
  }
  @keyframes flySwordAcross2 {
    0% { transform: translate(0, 0) rotate(-28deg) scale(1.25); opacity: 0; }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translate(135vw, -80vh) rotate(-28deg) scale(1.25); opacity: 0; }
  }
  @keyframes flySwordAcross3 {
    0% { transform: translate(0, 0) rotate(-36deg) scale(0.85); opacity: 0; }
    15% { opacity: 1; }
    85% { opacity: 1; }
    100% { transform: translate(125vw, -90vh) rotate(-36deg) scale(0.85); opacity: 0; }
  }

  /* 劍氣破空裂隙 */
  .fx-sword-rift {
    position: absolute;
    top: 48%;
    left: -10%;
    width: 120%;
    height: 3px;
    background: linear-gradient(90deg, transparent 5%, rgba(127,214,160,0.2) 20%, #E8FFF2 50%, rgba(127,214,160,0.9) 75%, transparent 95%);
    box-shadow: 0 0 25px rgba(127,214,160,0.95), 0 0 50px rgba(78,135,110,0.8);
    transform: rotate(-30deg);
    animation: slashRift calc(0.5s * var(--anim-speed)) ease-out both;
    transform-origin: center;
  }
  @keyframes slashRift {
    0% { opacity: 0; transform: rotate(-30deg) scaleX(0.05); }
    30% { opacity: 1; transform: rotate(-30deg) scaleX(1.15); }
    70% { opacity: 0.85; transform: rotate(-30deg) scaleX(1.3); }
    100% { opacity: 0; transform: rotate(-30deg) scaleX(1.5); }
  }

  /* 2. 弟子名冊：萬劍星宿列陣 */
  .fx-constellation-sword {
    position: absolute;
    top: -20vh;
    animation: swordDropToOrbit calc(0.68s * var(--anim-speed)) cubic-bezier(0.16, 1, 0.3, 1) both;
    filter: drop-shadow(0 0 18px rgba(155,195,174,0.95));
  }
  @keyframes swordDropToOrbit {
    0% { opacity: 0; transform: translate(var(--startX), 0) rotate(var(--rot)) scale(0.6); }
    35% { opacity: 1; }
    75% { opacity: 1; transform: translate(var(--endX), var(--endY)) rotate(var(--endRot)) scale(1); }
    100% { opacity: 0; transform: translate(var(--endX), calc(var(--endY) - 30px)) rotate(var(--endRot)) scale(1.1); }
  }

  /* 3. 洞府場館：乾坤八卦陣 */
  .fx-bagua-circle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(88vmin, 38rem);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    animation: baguaBurst calc(0.72s * var(--anim-speed)) cubic-bezier(0.12, 0.9, 0.25, 1) both;
  }
  @keyframes baguaBurst {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.15) rotate(0deg); }
    35% { opacity: 0.95; }
    75% { opacity: 0.85; transform: translate(-50%, -50%) scale(1.15) rotate(75deg); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.65) rotate(120deg); }
  }

  /* 4. 掌門殿：玄金古印鎮天 */
  .fx-seal-drop {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: imperialSealCrash calc(0.6s * var(--anim-speed)) cubic-bezier(0.18, 0.9, 0.28, 1.15) both;
  }
  @keyframes imperialSealCrash {
    0% { opacity: 0; transform: translate(-50%, -85vh) scale(1.8) rotate(-12deg); }
    65% { opacity: 1; transform: translate(-50%, -50%) scale(0.92) rotate(0deg); }
    80% { transform: translate(-50%, -53%) scale(1.04) rotate(0deg); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.12) rotate(0deg); }
  }
  .fx-seal-wave {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(92vmin, 40rem);
    aspect-ratio: 1;
    border: 3px solid rgba(201,169,97,0.9);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation: shockwaveExpand calc(0.58s * var(--anim-speed)) ease-out calc(0.32s * var(--anim-speed)) both;
  }
  @keyframes shockwaveExpand {
    0% { opacity: 0.95; transform: translate(-50%, -50%) scale(0.25); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.8); }
  }

  /* 仙印古篆徽標 */
  .fx-sigil-badge {
    position: absolute;
    top: calc(50% + min(16vmin, 7.5rem));
    left: 50%;
    transform: translate(-50%, -50%);
    animation: sigilBadgeIn calc(0.62s * var(--anim-speed)) cubic-bezier(0.16, 1, 0.3, 1) calc(0.12s * var(--anim-speed)) both;
  }
  @keyframes sigilBadgeIn {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(0.7); filter: blur(6px); }
    38% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
    82% { opacity: 0.95; }
    100% { opacity: 0; transform: translate(-50%, -60%) scale(1.08); filter: blur(4px); }
  }

  /* 境界徽章外觀 */
  .badge-qi { border: 1px solid rgba(110,158,136,.4); background: rgba(110,158,136,.12); color: #CDE9DA; }
  .badge-golden { border: 1px solid rgba(201,169,97,.4); background: rgba(201,169,97,.12); color: #FFE8A0; }
  .badge-transcendent { border: 1px solid rgba(214,169,61,.5); background: rgba(214,169,61,.18); color: #FFF2B5; box-shadow: 0 0 12px rgba(214,169,61,.3); }

  html[data-theme="light"] .badge-qi { color: #1E5C46; background: rgba(46,112,85,.12); border-color: rgba(46,112,85,.3); }
  html[data-theme="light"] .badge-golden { color: #785210; background: rgba(140,101,28,.12); border-color: rgba(140,101,28,.3); }
  html[data-theme="light"] .badge-transcendent { color: #694406; background: rgba(201,146,28,.18); border-color: rgba(201,146,28,.4); }
</style>
</head>
<body class="p-4 sm:p-8">

<!-- 全螢幕獨立飛劍與法術特效層 (像重新整理時的入殿劍陣) -->
<div id="cinematic-fx"></div>

<div class="mx-auto max-w-4xl">
  <!-- 頁頂說明與控制列 -->
  <header class="mb-6 flex flex-wrap items-center justify-between gap-4 border-b border-[var(--hair)] pb-5">
    <div>
      <div class="inline-flex items-center gap-2 rounded-full border border-[rgba(155,195,174,.25)] bg-[rgba(155,195,174,.08)] px-3 py-1 text-xs font-semibold text-[var(--jade-300)]">
        <span>仙門法術動效實驗室</span> · <span>Cinematic Xianxia FX</span>
      </div>
      <h1 class="disp mt-2 text-2xl font-bold tracking-wider text-[var(--mist-1)] sm:text-3xl">落雲宗 · 獨立飛劍法術過場預覽</h1>
      <p class="mt-1 text-xs text-[var(--mist-3)] sm:text-sm">點擊下方標籤，立即體驗獨立於網頁之外、凌空破空的飛劍法陣全螢幕視覺特效！</p>
    </div>

    <!-- 模式與速度切換控制 -->
    <div class="flex flex-wrap items-center gap-2">
      <a href="/console.html" class="flex items-center gap-1.5 rounded-full border border-[var(--hair-2)] bg-[rgba(228,235,232,.06)] px-3 py-1.5 text-xs font-medium text-[var(--mist-1)] transition hover:bg-[rgba(228,235,232,.12)]">
        <i data-lucide="ArrowLeft" class="h-3.5 w-3.5"></i> 前往後台
      </a>
      <button id="btn-fx-toggle" class="flex items-center gap-1.5 rounded-full border border-[rgba(155,195,174,.4)] bg-[rgba(155,195,174,.15)] px-3 py-1.5 text-xs font-semibold text-[var(--jade-100)] transition hover:bg-[rgba(155,195,174,.25)]" title="切換獨立全螢幕法術動效">
        <i data-lucide="Sparkles" class="h-3.5 w-3.5"></i> <span id="fx-toggle-label">飛劍法術：已開啟</span>
      </button>
      <button id="btn-replay" class="flex items-center gap-1.5 rounded-full border border-[var(--hair-2)] bg-[rgba(228,235,232,.06)] px-3 py-1.5 text-xs font-medium text-[var(--mist-1)] transition hover:bg-[rgba(228,235,232,.12)]">
        <i data-lucide="RotateCcw" class="h-3.5 w-3.5"></i> 重播法術
      </button>
      <button id="btn-speed" class="flex items-center gap-1.5 rounded-full border border-[var(--hair-2)] bg-[rgba(228,235,232,.06)] px-3 py-1.5 text-xs font-medium text-[var(--mist-1)] transition hover:bg-[rgba(228,235,232,.12)]" title="切換動態速度">
        <span id="speed-label">速度 1.0x</span>
      </button>
      <button id="btn-theme" class="flex items-center gap-1.5 rounded-full border border-[var(--hair-2)] bg-[rgba(228,235,232,.06)] px-3 py-1.5 text-xs font-medium text-[var(--mist-1)] transition hover:bg-[rgba(228,235,232,.12)]">
        <i data-lucide="SunMedium" class="h-3.5 w-3.5"></i> <span id="theme-label">深色</span>
      </button>
    </div>
  </header>

  <!-- 仿正式站導覽列 Tabs -->
  <nav class="surface relative mb-5 flex gap-2 overflow-x-auto rounded-2xl p-2">
    <button data-tab="events" class="tab-btn flex items-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold transition active-tab text-[var(--jade-100)] bg-[rgba(155,195,174,.18)] border border-[rgba(155,195,174,.25)] shadow-inner">
      <i data-lucide="CalendarDays" class="h-4 w-4"></i> 試煉佈告
    </button>
    <button data-tab="members" class="tab-btn flex items-center gap-2 rounded-xl px-4 py-2.5 text-sm font-medium text-[var(--mist-3)] transition hover:text-[var(--mist-1)] hover:bg-[rgba(228,235,232,.05)]">
      <i data-lucide="Users" class="h-4 w-4"></i> 弟子名冊
    </button>
    <button data-tab="venues" class="tab-btn flex items-center gap-2 rounded-xl px-4 py-2.5 text-sm font-medium text-[var(--mist-3)] transition hover:text-[var(--mist-1)] hover:bg-[rgba(228,235,232,.05)]">
      <i data-lucide="MapPinned" class="h-4 w-4"></i> 洞府場館
    </button>
    <button data-tab="admin" class="tab-btn flex items-center gap-2 rounded-xl px-4 py-2.5 text-sm font-medium text-[var(--mist-3)] transition hover:text-[var(--mist-1)] hover:bg-[rgba(228,235,232,.05)]">
      <i data-lucide="Settings" class="h-4 w-4"></i> 掌門殿
    </button>
  </nav>

  <!-- 展演舞台 Stage Container -->
  <main id="stage" class="relative min-h-[300px]">
    <!-- 動態注入內容 -->
  </main>

  <!-- 動效設計理念卡片 -->
  <footer id="explanation" class="surface mt-5 rounded-2xl p-5 text-xs leading-relaxed text-[var(--mist-2)]">
    <!-- 動態注入理念說明 -->
  </footer>
</div>

<script>
  lucide.createIcons();

  var currentTab = 'events';
  var speed = 1.0;
  var theme = 'dark';
  var fxEnabled = true;

  function getSwordSvg() {
    return `
      <svg class="w-10 sm:w-12 h-56 sm:h-64 drop-shadow-[0_0_20px_rgba(127,214,160,0.95)]" viewBox="0 0 40 220" fill="none">
        <path d="M20 0 L27 35 L25 155 L20 160 L15 155 L13 35 Z" fill="url(#bladeG)" />
        <path d="M20 5 L20 155" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
        <rect x="7" y="157" width="26" height="8" rx="3" fill="url(#goldG)" stroke="#FFE8A0" stroke-width="1"/>
        <circle cx="20" cy="161" r="3.5" fill="#1B4D3E" stroke="#FFE8A0" stroke-width="1"/>
        <rect x="17" y="165" width="6" height="34" rx="2" fill="#11241D" stroke="#3D6555" stroke-width="1.2"/>
        <circle cx="20" cy="202" r="5" fill="url(#goldG)"/>
        <path d="M20 206 Q14 217 21 228" stroke="#9BC3AE" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M20 206 Q26 218 19 228" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
        <defs>
          <linearGradient id="bladeG" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#3D735C"/>
            <stop offset="50%" stop-color="#E2F8EE"/>
            <stop offset="100%" stop-color="#3D735C"/>
          </linearGradient>
          <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FFEBB0"/>
            <stop offset="50%" stop-color="#C9A961"/>
            <stop offset="100%" stop-color="#7A5B18"/>
          </linearGradient>
        </defs>
      </svg>
    `;
  }

  function playCinematicRitual(tabKey) {
    if (!fxEnabled) return;
    var overlay = document.getElementById('cinematic-fx');
    if (!overlay) return;
    overlay.innerHTML = '';
    document.body.classList.remove('screen-shake');

    if (tabKey === 'events') {
      // 1. 試煉佈告：青竹飛劍凌空破空 + 虛空裂隙
      overlay.innerHTML = `
        <div class="fx-sword-rift"></div>
        <div class="fx-sword-fly-1">${getSwordSvg()}</div>
        <div class="fx-sword-fly-2">${getSwordSvg()}</div>
        <div class="fx-sword-fly-3">${getSwordSvg()}</div>
        <div class="fx-sigil-badge pointer-events-none rounded-2xl border border-[rgba(155,195,174,.45)] bg-[rgba(8,18,15,.9)] px-6 py-3 text-center shadow-[0_0_40px_rgba(127,214,160,.45)] backdrop-blur-md">
          <span class="disp text-lg sm:text-xl font-black tracking-widest text-[#D7F7E6]">落雲宗 · 試煉戰帖</span>
          <span class="block text-[10px] sm:text-xs tracking-[.35em] text-[var(--jade-300)] mt-0.5">青竹飛劍 · 破空開壇</span>
        </div>
      `;
    } else if (tabKey === 'members') {
      // 2. 弟子名冊：萬劍星宿列陣
      var swordsHtml = '';
      var pos = [
        { sx: '-35vw', ex: '-18vw', ey: '48vh', rot: '-20deg', erot: '12deg', del: '0s' },
        { sx: '-16vw', ex: '-9vw', ey: '42vh', rot: '-10deg', erot: '25deg', del: '0.04s' },
        { sx: '0vw', ex: '0vw', ey: '38vh', rot: '0deg', erot: '0deg', del: '0.08s' },
        { sx: '16vw', ex: '9vw', ey: '42vh', rot: '10deg', erot: '-25deg', del: '0.05s' },
        { sx: '35vw', ex: '18vw', ey: '48vh', rot: '20deg', erot: '-12deg', del: '0.02s' }
      ];
      pos.forEach(function(p) {
        swordsHtml += `
          <div class="fx-constellation-sword" style="left:50%; --startX:${p.sx}; --endX:${p.ex}; --endY:${p.ey}; --rot:${p.rot}; --endRot:${p.erot}; animation-delay:calc(${p.del} * var(--anim-speed));">
            ${getSwordSvg()}
          </div>
        `;
      });
      overlay.innerHTML = `
        ${swordsHtml}
        <div class="fx-sigil-badge pointer-events-none rounded-2xl border border-[rgba(155,195,174,.45)] bg-[rgba(8,18,15,.9)] px-6 py-3 text-center shadow-[0_0_40px_rgba(127,214,160,.45)] backdrop-blur-md">
          <span class="disp text-lg sm:text-xl font-black tracking-widest text-[#D7F7E6]">萬法玉簡 · 星宿列陣</span>
          <span class="block text-[10px] sm:text-xs tracking-[.35em] text-[var(--jade-300)] mt-0.5">弟子名籍 · 諸星歸位</span>
        </div>
      `;
    } else if (tabKey === 'venues') {
      // 3. 洞府場館：金色八卦太極陣圖旋轉炸裂
      overlay.innerHTML = `
        <div class="fx-bagua-circle flex items-center justify-center pointer-events-none">
          <svg class="w-full h-full text-[var(--gold)] drop-shadow-[0_0_45px_rgba(201,169,97,0.85)]" viewBox="0 0 400 400" fill="none">
