<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>落雲宗・排場執事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<style>
  /* 版面與配色比照「羽球排場王」：藍色場館底、綠色球場、黃框白線、粉紅按鈕。
     ponytail: 不用 Tailwind。public/tailwind.css 是預先建置的成品，新 class 不在裡面就靜靜失效。 */
  :root {
    --arena: #4A8FC4;
    --arena-dark: #3B7DB0;
    --court: #0B6B45;
    --court-edge: #0A5C3C;
    --court-yellow: #E8E600;
    --court-line: rgba(255,255,255,.88);
    --slot: rgba(255,255,255,.07);
    --slot-line: rgba(220,240,210,.35);
    --arrow: rgba(150,205,95,.62);
    --name: #FFF27A;
    --name-locked: #3DF2C0;
    --sub: #FFFFFF;
    --team: #E6ECF2;
    --pink: #E91E63;
    --pink-soft: #F48FB1;
    --pink-bg: #F9E7F1;
    --pink-text: #E91E63;
    --btn-text: #FFEB3B;
    --grey-btn: #5F7F99;
    --ink: #2B2B2B;
    --purple: #673AB7;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--arena); }
  body {
    color: var(--sub); min-height: 100vh;
    font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .wrap { position: relative; padding: 10px 12px 18px; max-width: 1900px; margin: 0 auto; }

  .clock {
    position: absolute; right: 6px; top: 6px; z-index: 5; pointer-events: none;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 12px; border-radius: 999px;
    background: rgba(20,35,50,.88); color: #fff;
    font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .clock svg { width: 15px; height: 15px; }

  .banner {
    font-size: 13px; padding: 7px 12px; border-radius: 8px; margin: 0 0 10px;
    background: rgba(255,255,255,.92); color: var(--ink);
  }
  .banner a { color: var(--pink); font-weight: 700; }
  .banner.err { background: #FFEBEE; color: #B71C1C; }

  /* 整個排場畫面塞進一個螢幕，欄列由 layoutFor() 依場數決定 */
  .arena { display: grid; gap: 12px 16px; height: calc(100vh - 24px); min-height: 480px; }
  .col, .qwrap { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; position: relative; }
  .col .canvas, .qwrap .canvas { flex: 1 1 auto; }
  .col.rest-strip { flex-direction: row; align-items: stretch; gap: 16px; }
  .col.rest-strip .ctl { justify-content: center; }
  .col.rest-strip .zname { left: 12px; transform: translateY(-50%); width: auto; text-align: left; }
  .col.rest-block .ctl { align-items: flex-end; }

  .canvas {
    position: relative; min-height: 70px;
    background: var(--court); border: 1px solid var(--court-edge);
    touch-action: none;
  }
  .canvas.slot { background: var(--slot); border-color: rgba(255,255,255,.08); }
  .canvas.rest { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.12); }
  .canvas.drop { outline: 2px solid rgba(255,255,255,.75); outline-offset: -2px; }
  .canvas svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .zname {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 70%; text-align: center; background: none; border: none; padding: 0;
    color: #fff; font: inherit; font-size: 20px; letter-spacing: .06em;
    pointer-events: auto;
  }
  .zname:focus { outline: 1px dashed rgba(255,255,255,.6); }
  .zname:disabled { color: #fff; opacity: 1; }
  .canvas.slot .zname, .canvas.rest .zname { pointer-events: none; color: rgba(255,255,255,.9); }
  .canvas.rest .zname { color: rgba(225,240,250,.55); font-weight: 700; }
  .hand { position: absolute; right: 8px; bottom: 6px; font-size: 18px; opacity: .9; pointer-events: none; filter: grayscale(1) brightness(3); }

  /* 輸送帶箭頭：排隊 N 往左遞補到排隊 N-1 */
  .arrow {
    position: absolute; left: -22px; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 0; height: 0; pointer-events: none;
    border-top: 26px solid transparent; border-bottom: 26px solid transparent;
    border-right: 58px solid var(--arrow);
  }
  .qwrap .arrow { left: -22px; }
  @media (max-width: 719px) {
    .arrow { display: none; }
    .arena { height: auto; grid-template-columns: 1fr 1fr !important; grid-template-rows: none !important; }
    .arena > * { grid-column: auto !important; grid-row: auto !important; }
    .arena > .col.rest-side, .arena > .col.rest-strip, .arena > .col.rest-block { grid-column: 1 / -1 !important; flex-direction: column; }
    .canvas { aspect-ratio: 16 / 11; flex: 0 0 auto; }
  }

  .ctlrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex: 0 0 auto; }
  .timer { color: #fff; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  /* 計時變色：3 分黃、7 分橘、12 分紅（App 實測） */
  .timer.yellow { color: #FFEB3B; }
  .timer.orange { color: #FFA726; }
  .timer.red { color: #FF4F7B; }
  .swapbtn {
    flex: 0 1 auto; width: 58%; max-width: 130px; min-width: 0; white-space: nowrap; height: 42px; border: none; border-radius: 999px; cursor: pointer;
    background: var(--pink); color: var(--btn-text); font: inherit; font-size: 18px; font-weight: 500;
    box-shadow: 0 3px 8px rgba(0,0,0,.2);
  }
  .swapbtn:disabled { opacity: .45; cursor: not-allowed; }

  .ctl { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .ctl .btns { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .round {
    width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--grey-btn); color: #fff; font: inherit; font-size: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.2);
  }
  .round:disabled { opacity: .45; cursor: not-allowed; }
  .round svg { width: 22px; height: 22px; }
  .round.gear { background: var(--pink); }
  .round.armed { background: #7C4DFF; }
  .round.m-off { background: var(--grey-btn); }
  .round.m-fair { background: #22D32A; }
  .round.m-level { background: #FF7043; }
  .round.m-variety { background: #E040FB; }
  .modetext { color: #fff; font-size: 15px; font-weight: 700; }

  /* 球員：等級色條＋黃色名字，第二行是等待分鐘 */
  .chip {
    display: inline-grid; grid-template-columns: auto auto; column-gap: 3px; align-items: start;
    cursor: grab; user-select: none; touch-action: none; white-space: nowrap;
    font-size: var(--chip-fs, 18px); line-height: 1.15;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  .canvas .chip { position: absolute; transform: translate(-12%, -30%); }
  .chip .bar { grid-row: 1; width: .32em; height: 1.05em; margin-top: .08em; background: #F5F5F5; }
  .chip .nm { grid-row: 1; color: var(--name); font-weight: 700; }
  .chip.locked .nm { color: var(--name-locked); }
  .chip .meta { grid-column: 1 / span 2; font-size: .62em; color: var(--sub); display: flex; gap: .5em; font-weight: 700; }
  .chip .meta .lv { color: var(--team); }
  /* 等待分鐘變色：10 分黃、16 分紅（App 實測） */
  .chip .meta .w.yellow { color: #FFEB3B; }
  .chip .meta .w.red { color: #FF4F7B; }
  .chip.ghosting { opacity: .3; }
  .drag-ghost {
    position: fixed; left: 0; top: 0; z-index: 99; pointer-events: none;
    padding: 3px 10px; border-radius: 6px; font-size: 16px; font-weight: 700;
    background: rgba(20,35,50,.9); color: var(--name); box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }

  .pool {
    margin-top: 14px; padding: 10px 12px; border-radius: 4px;
    background: var(--arena-dark); border: 1px solid rgba(255,255,255,.12);
  }
  .pool.drop { outline: 2px solid rgba(255,255,255,.75); outline-offset: -2px; }
  .pool-head { font-size: 15px; font-weight: 700; margin-bottom: 8px; color: #fff; }
  .pool-head .n { font-size: 12px; font-weight: 400; opacity: .85; margin-left: 6px; }
  .pool .list { display: flex; flex-wrap: wrap; gap: 8px 18px; min-height: 40px; }
  .empty { font-size: 13px; opacity: .75; }

  /* 功能按鈕：白底對話框，比照 App */
  .modal-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal {
    position: relative; background: #fff; color: var(--ink); border-radius: 4px;
    padding: 22px 26px; width: 100%; max-width: 420px; max-height: 88vh; display: flex; flex-direction: column;
  }
  .modal .x { position: absolute; right: 12px; top: 8px; border: none; background: none; font-size: 26px; cursor: pointer; color: #333; }
  .modal h2 { font-size: 20px; margin: 4px 0 14px; font-weight: 700; }
  .frow { display: flex; align-items: center; gap: 12px; padding: 9px 0; font-size: 18px; }
  .frow .ic { border: none; background: none; cursor: pointer; padding: 2px; color: #333; display: inline-flex; }
  .frow .ic:disabled { opacity: .35; cursor: not-allowed; }
  .frow .ic svg { width: 28px; height: 28px; }
  .frow a.ic { text-decoration: none; }
  .modal pre {
    flex: 1 1 auto; overflow: auto; margin: 0 0 12px; padding: 10px 12px; border: 1px solid #999; border-radius: 2px;
    background: #F4F1F4; color: #333; font-size: 15px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
  }
  .modal.log { max-width: 520px; background: #EFE9EF; border-radius: 24px; }
  .mfoot { display: flex; gap: 22px; justify-content: flex-end; }
  .mfoot button { border: none; background: none; color: var(--purple); font: inherit; font-size: 14px; cursor: pointer; }

  /* 設定：淡粉紅底、粉紅分段標題、粉紅開關，比照 App 設定頁 */
  .modal.setup { background: var(--pink-bg); max-width: 560px; padding: 0; }
  .setup-head {
    background: var(--pink); color: #fff; text-align: center; font-size: 22px; letter-spacing: .06em;
    padding: 16px 40px 16px; border-radius: 4px 4px 0 0;
  }
  .setup-head .x { color: #fff; top: 10px; }
  .setup-body { overflow: auto; padding: 4px 26px 18px; }
  .sect { text-align: center; color: var(--pink-text); font-size: 18px; margin: 18px 0 6px; }
  .prow { display: flex; align-items: center; gap: 12px; padding: 10px 0; font-size: 17px; color: #333; }
  .prow .lbl { flex: 1 1 auto; }
  .sw { width: 54px; height: 30px; border-radius: 999px; background: #E6E0E6; border: 2px solid #79747E; position: relative; cursor: pointer; flex: 0 0 auto; }
  .sw::after { content: ""; position: absolute; top: 5px; left: 6px; width: 16px; height: 16px; border-radius: 50%; background: #79747E; transition: .15s; }
  .sw.on { background: var(--pink-soft); border-color: var(--pink-soft); }
  .sw.on::after { top: 2px; left: 25px; width: 22px; height: 22px; background: var(--pink); }
  .prow input[type=range] { flex: 1 1 auto; accent-color: var(--purple); }
  .fsval { font-size: 20px; font-weight: 700; color: #444; min-width: 70px; }
  .seg { display: inline-flex; gap: 6px; }
  .seg button {
    border: 1px solid var(--pink-soft); background: #fff; color: var(--pink); border-radius: 999px;
    padding: 4px 12px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .seg button.on { background: var(--pink); color: #fff; border-color: var(--pink); }
  .sel { font: inherit; font-size: 16px; padding: 4px 10px; border: 1px solid var(--pink-soft); border-radius: 6px; background: #fff; color: #333; }
  .pillbtn {
    border: none; border-radius: 999px; padding: 8px 18px; background: #fff; color: var(--pink);
    font: inherit; font-size: 15px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.18);
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="application/json" id="snapshot">{}</script>
<script>
(function () {
  var E = React.createElement, useState = React.useState, useEffect = React.useEffect, useRef = React.useRef;

  function isProps(x) { return x && typeof x === 'object' && !Array.isArray(x) && !x.type; }
  function D(cls) {
    var k = [].slice.call(arguments, 1);
    var extra = isProps(k[0]) ? k.shift() : null;
    return E.apply(null, ['div', Object.assign({}, extra, { className: cls })].concat(k));
  }
  function S(cls) {
    var k = [].slice.call(arguments, 1);
    var extra = isProps(k[0]) ? k.shift() : null;
    return E.apply(null, ['span', Object.assign({}, extra, { className: cls })].concat(k));
  }

  /* 以下門檻都是在 App 實機上計時觀察出來的 */
  function timerTone(sec) { return sec >= 720 ? 'red' : sec >= 420 ? 'orange' : sec >= 180 ? 'yellow' : ''; }
  function waitTone(min) { return min >= 16 ? 'red' : min >= 10 ? 'yellow' : ''; }
  var PREF_KEY = 'luoyun-court-prefs';
  /* 換場自動挑人的四種模式，對應「羽球排場王」的 Auto 循環。
     存在 lineup 而不是 localStorage：同一場活動的多位長老應該用同一套規則。 */
  var AUTO_MODES = [
    { key: 'off', label: '關閉', tone: 'off', hint: '換場只用排隊 1，排隊沒人就留空給你手動排' },
    { key: 'fair', label: '排隊公平', tone: 'fair', hint: '等待最久的優先，不看程度也不看搭配' },
    { key: 'level', label: '程度均衡', tone: 'level', hint: '挑程度接近的四人，上場時強弱分隊（會覆蓋排隊裡排好的隊形）' },
    { key: 'variety', label: '搭配變化', tone: 'variety', hint: '等待優先，且避開剛剛同場過的人' }
  ];
  function modeAt(key) {
    for (var i = 0; i < AUTO_MODES.length; i++) if (AUTO_MODES[i].key === key) return AUTO_MODES[i];
    return AUTO_MODES[3];
  }
  /* 顯示偏好存在瀏覽器，不進 lineup：平板要大字、手機要精簡，各台裝置不該互相覆蓋。 */
  var LEVEL_COLORS = ['#F5F5F5', '#F5F5F5', '#F8BBD0', '#2196F3', '#9C27B0', '#3F51B5', '#4CAF50', '#FFEB3B', '#FF9800'];
  function loadPrefs() {
    var d = {
      timer: true, count: false, wait: true, level: false, levelColor: true, gender: false,
      voice: true, voiceTimes: 2, preAnnounce: false, pairAnnounce: false, autoLock: true, scale: 1
    };
    try { return Object.assign(d, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch (e) { return d; }
  }

  function clone(v) { return JSON.parse(JSON.stringify(v)); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function mmss(sec) { return pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60); }
  function hms(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 3600) + ':' + pad2(Math.floor(s / 60) % 60) + ':' + pad2(s % 60);
  }
  function parseDrop(str) {
    var p = String(str || '').split(':');
    if (p[0] === 'court') return { kind: 'court', courtNum: Number(p[1]) };
    if (p[0] === 'queue') return { kind: 'queue', qidx: Number(p[1]) };
    return { kind: p[0] };
  }
  function emptySlot(i) {
    return { id: 'q' + (i + 1), mode: 'balanced', teamA: [], teamB: [], createdAt: new Date().toISOString() };
  }
  function pairKey(a, b) { return a < b ? a + '|' + b : b + '|' + a; }
  function defaultPos(i) {
    if (i >= 4) return { x: 0.12 + (i % 3) * 0.3, y: 0.42 + (Math.floor((i - 4) / 3) % 3) * 0.16 };
    var col = i % 2, row = Math.floor(i / 2) % 2;
    return { x: col ? 0.72 : 0.28, y: row ? 0.74 : 0.26 };
  }

  function CourtApp() {
    var dataState = useState(null), data = dataState[0], setData = dataState[1];
    var meState = useState(null), me = meState[0], setMe = meState[1];
    var dragState = useState(null), dragging = dragState[0], setDragging = dragState[1];
    var nowState = useState(Date.now()), nowTime = nowState[0], setNowTime = nowState[1];
    var busyState = useState(false), busy = busyState[0], setBusy = busyState[1];
    var errState = useState(''), err = errState[0], setErr = errState[1];
    var logState = useState(''), logText = logState[0], setLogText = logState[1];
    var prefState = useState(loadPrefs), prefs = prefState[0], setPrefs = prefState[1];
    var setupState = useState(false), setupOpen = setupState[0], setSetupOpen = setupState[1];
    var funcState = useState(false), funcOpen = funcState[0], setFuncOpen = funcState[1];
    var adjustState = useState(0), adjustMode = adjustState[0], setAdjustMode = adjustState[1];
    var histState = useState([]), history = histState[0], setHistory = histState[1];
    var futureState = useState([]), future = futureState[0], setFuture = futureState[1];
    var dragRef = useRef(null), ghostRef = useRef(null), labelDraft = useRef({});

    function savePrefs(patch) {
      var next = Object.assign({}, prefs, patch);
      setPrefs(next);
      try { localStorage.setItem(PREF_KEY, JSON.stringify(next)); } catch (e) {}
    }

    function speak(text) {
      if (!prefs.voice || !window.speechSynthesis) return;
      try {
        window.speechSynthesis.cancel();
        var times = Math.max(1, Math.min(3, Number(prefs.voiceTimes) || 1));
        for (var i = 0; i < times; i++) {
          var u = new SpeechSynthesisUtterance(text);
          u.lang = 'zh-TW';
          window.speechSynthesis.speak(u);
        }
      } catch (e) {}
    }

    function refresh(includeSession) {
      fetch('/api/public').then(function (r) { return r.json(); }).then(function (res) {
        setData(res);
      }).catch(function () {});
      if (includeSession) {
        fetch('/api/session').then(function (r) { return r.json(); }).then(function (res) {
          setMe(res.me || null);
        }).catch(function () {});
      }
    }

    useEffect(function () {
      refresh(true);
      var tick = 0;
      // 背景分頁不輪詢以節省請求，但首次載入一律要抓，否則背景開啟會卡在載入中
      var poller = setInterval(function () { if (document.hidden) return; tick++; refresh(tick % 8 === 0); }, 3500);
      function onVis() { if (!document.hidden) refresh(true); }
      document.addEventListener('visibilitychange', onVis);
      return function () {
        clearInterval(poller);
        document.removeEventListener('visibilitychange', onVis);
      };
    }, []);

    useEffect(function () {
      var t = setInterval(function () { setNowTime(Date.now()); }, 1000);
      return function () { clearInterval(t); };
    }, []);

    var events = (data && data.events) || [];
    var targetId = new URLSearchParams(window.location.search).get('event');
    var activeEvent = (targetId && events.find(function (e) { return e.id === targetId; })) || events[0] || null;

    var baseLineup = (activeEvent && activeEvent.lineup) || { courts: [], stats: {}, resting: [], queue: [] };
    var numCourts = (activeEvent && Number(activeEvent.courts)) || 1;
    var courts = (baseLineup.courts || []).slice(0, numCourts).map(clone);
    while (courts.length < numCourts) {
      courts.push({ courtNum: courts.length + 1, status: 'idle', mode: 'balanced', teamA: [], teamB: [], label: '' });
    }
    // 排隊格數＝場地數＋1，比照 App（3 面 4 格、5 面 6 格）
    var qSlots = numCourts + 1;
    var queue = [];
    for (var qi = 0; qi < qSlots; qi++) {
      var qsrc = (baseLineup.queue || [])[qi];
      queue.push(qsrc ? Object.assign(emptySlot(qi), clone(qsrc), { id: 'q' + (qi + 1) }) : emptySlot(qi));
    }
    var resting = (baseLineup.resting || []).slice();
    var stats = baseLineup.stats || {};
    var lockedList = baseLineup.locked || [];
    var posMap = baseLineup.pos || {};
    var sinceMap = baseLineup.since || {};
    var stateMap = baseLineup.state || {};
    var timesMap = baseLineup.times || {};
    var autoMode = modeAt(baseLineup.autoMode).key;

    var roster = (activeEvent && activeEvent.roster) || [];
    var going = roster.filter(function (r) { return r.status === 'going'; });
    var detail = {};
    going.forEach(function (r) { detail[r.nickname] = r; });

    // 去重：teamA/teamB 可能被別的頁面或舊資料寫入重複名字，
    // 重複的名字會讓 React key 撞號、也會讓換場算錯人數。
    function membersOf(z) {
      var seen = {};
      return ((z && z.teamA) || []).concat((z && z.teamB) || []).filter(function (n) {
        if (!n || seen[n]) return false;
        seen[n] = 1;
        return true;
      });
    }

    var placed = {};
    courts.forEach(function (c) { membersOf(c).forEach(function (n) { placed[n] = 1; }); });
    queue.forEach(function (q) { membersOf(q).forEach(function (n) { placed[n] = 1; }); });
    resting.forEach(function (n) { placed[n] = 1; });
    var pool = going.filter(function (r) { return !placed[r.nickname]; });
    pool.sort(function (a, b) {
      var wa = sinceMap[a.nickname] || 0, wb = sinceMap[b.nickname] || 0;
      if (wa !== wb) return wa - wb;
      return (stats[a.nickname] || 0) - (stats[b.nickname] || 0);
    });

    function isLocked(name) { return lockedList.indexOf(name) >= 0; }

    /* 寫入沿用 board.html 的路徑：先讀 /api/state 取版本，再 POST /api/action。
       伺服器有樂觀鎖，版本落後會被拒絕。 */
    function saveLineup(next, isUndo) {
      if (!me || !activeEvent || busy) return;
      // 復原點只存在本機：跨裝置共用一份會互相打架，而樂觀鎖已擋掉覆寫舊資料的風險
      if (!isUndo) {
        setHistory(function (old) { return old.concat([clone(baseLineup)]).slice(-10); });
        setFuture([]);
      }
      setBusy(true);
      setErr('');
      fetch('/api/state').then(function (r) {
        if (!r.ok) throw new Error('讀取狀態失敗，請確認長老登入狀態');
        return r.json();
      }).then(function (st) {
        if (st.error) throw new Error(st.error);
        return fetch('/api/action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ version: st.version, action: 'updateLineup', id: activeEvent.id, row: { lineup: next } })
        });
      }).then(function (r) {
        return r.json().then(function (res) {
          if (!r.ok || res.error) throw new Error(res.error || '排位更新失敗');
          return res;
        });
      }).then(function () {
        setBusy(false);
        refresh();
      }).catch(function (e) {
        setBusy(false);
        setErr(e.message || '排位儲存失敗，請重新整理');
        refresh();
      });
    }

    function snapshotState() {
      return { courts: clone(courts), queue: clone(queue), resting: resting.slice(), pos: clone(posMap) };
    }

    /* 三個時間累計器用不變式維護：每次存檔比對狀態，狀態變了就把上一段時間結算進去。
       比在每個動作裡各記一次可靠，不會漏掉任何一條路徑。 */
    function syncClocks(st, prev) {
      var times = clone(prev.times || {});
      var since = Object.assign({}, prev.since || {});
      var state = Object.assign({}, prev.state || {});
      var stamp = Date.now();
      var onPlay = {}, onRest = {};
      st.courts.forEach(function (c) {
        if (c.status !== 'playing') return;
        membersOf(c).forEach(function (n) { onPlay[n] = 1; });
      });
      st.resting.forEach(function (n) { onRest[n] = 1; });
      going.forEach(function (r) {
        var n = r.nickname;
        var next = onPlay[n] ? 'play' : (onRest[n] ? 'rest' : 'wait');
        if (since[n] == null) { since[n] = stamp; state[n] = next; return; }
        if (state[n] !== next) {
          var bucket = times[n] || { play: 0, wait: 0, rest: 0 };
          var was = state[n] || 'wait';
          bucket[was] = (bucket[was] || 0) + (stamp - since[n]);
          times[n] = bucket;
          since[n] = stamp;
          state[n] = next;
        }
      });
      return { times: times, since: since, state: state };
    }

    function buildLineup(st, extra) {
      var out = Object.assign({}, baseLineup, {
        courts: st.courts, queue: st.queue, resting: st.resting, pos: st.pos
      }, extra || {});
      var clocks = syncClocks(st, out);
      out.times = clocks.times;
      out.since = clocks.since;
      out.state = clocks.state;
      return out;
    }

    /* 注意：這會把名字從「每一個」場地與排隊格裡濾掉，包含你正要讀取的那一格。
       要搬移某組人時，務必先把名單複製出來再呼叫，否則複製到的是空陣列。 */
    function pluck(st, name) {
      st.courts.forEach(function (c) {
        c.teamA = (c.teamA || []).filter(function (n) { return n !== name; });
        c.teamB = (c.teamB || []).filter(function (n) { return n !== name; });
      });
      st.queue.forEach(function (q) {
        q.teamA = (q.teamA || []).filter(function (n) { return n !== name; });
        q.teamB = (q.teamB || []).filter(function (n) { return n !== name; });
      });
      st.resting = st.resting.filter(function (n) { return n !== name; });
    }

    function zoneOf(st, addr) {
      if (addr.kind === 'court') return st.courts.find(function (x) { return x.courtNum === addr.courtNum; });
      if (addr.kind === 'queue') return st.queue[addr.qidx];
      return null;
    }

    /* 自由定位：teamA/teamB 依 y 座標的上下半場推導，board.html 才讀得到隊伍。 */
    function putAt(st, name, addr, x, y) {
      pluck(st, name);
      if (addr.kind === 'pool') return;
      var p = { x: Math.min(0.9, Math.max(0.04, x)), y: Math.min(0.88, Math.max(0.08, y)) };
      st.pos[name] = p;
      if (addr.kind === 'rest') { st.resting.push(name); return; }
      var z = zoneOf(st, addr);
      if (!z) return;
      (p.y > 0.5 ? z.teamB : z.teamA).push(name);
    }

    /* 同隊綁定：同一格同一半場的兩人都鎖定時，拖一個就兩個一起走（App V1.5.8）。 */
    function lockedPartner(name) {
      if (!isLocked(name)) return null;
      var zones = courts.concat(queue);
      for (var i = 0; i < zones.length; i++) {
        var z = zones[i];
        var teams = [z.teamA || [], z.teamB || []];
        for (var t = 0; t < 2; t++) {
          if (teams[t].indexOf(name) < 0) continue;
          var mate = teams[t].filter(function (n) { return n !== name && isLocked(n); });
          return mate.length === 1 ? mate[0] : null;
        }
      }
      return null;
    }

    function place(name, addr, x, y) {
      var st = snapshotState();
      var mate = lockedPartner(name);
      var p0 = posMap[name], pm = mate && posMap[mate];
      putAt(st, name, addr, x, y);
      if (mate) {
        var dx = (pm && p0) ? pm.x - p0.x : 0.3, dy = (pm && p0) ? pm.y - p0.y : 0;
        putAt(st, mate, addr, st.pos[name] ? st.pos[name].x + dx : x + dx, st.pos[name] ? st.pos[name].y + dy : y + dy);
      }
      if (addr.kind === 'court') {
        var tc = st.courts.find(function (x) { return x.courtNum === addr.courtNum; });
        if (tc && tc.status !== 'playing' && membersOf(tc).length >= 4) {
          tc.status = 'playing';
          tc.matchStart = new Date().toISOString();
        }
      }
      var extra = {};
      // 移動球員自動加鎖：拖進場地就鎖，換場時不被自動排場調走
      if (prefs.autoLock && addr.kind === 'court' && !isLocked(name)) {
        extra.locked = lockedList.concat([name]);
      }
      saveLineup(buildLineup(st, extra));
    }

    /* 輕觸切換鎖定：鎖定的人不會被自動排場挑中或調動，手動拖曳與換場不受影響。 */
    function adjustCount(name, delta) {
      setAdjustMode(0);
      if (!me) return;
      var next = Object.assign({}, stats);
      next[name] = Math.max(0, (next[name] || 0) + delta);
      saveLineup(Object.assign({}, baseLineup, { stats: next }));
    }

    function toggleLock(name) {
      if (!me) return;
      var next = isLocked(name)
        ? lockedList.filter(function (n) { return n !== name; })
        : lockedList.concat([name]);
      saveLineup(Object.assign({}, baseLineup, { locked: next }));
    }

    /* 拖曳用 pointer events 自己實作：HTML5 drag 在觸控裝置上根本不觸發，
       而現場是平板。移動中的殘影直接操作 DOM，不走 React，避免每幀重繪整頁。 */
    function onChipPointerDown(name, ev) {
      if (!me || busy) return;
      dragRef.current = { name: name, id: ev.pointerId, x0: ev.clientX, y0: ev.clientY, moved: false };
      try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (e) {}
    }

    function onChipPointerMove(ev) {
      var d = dragRef.current;
      if (!d || d.id !== ev.pointerId) return;
      if (!d.moved) {
        if (Math.abs(ev.clientX - d.x0) < 6 && Math.abs(ev.clientY - d.y0) < 6) return;
        d.moved = true;
        setDragging(d.name);
      }
      var g = ghostRef.current;
      if (!g) {
        g = document.createElement('div');
        g.className = 'drag-ghost';
        document.body.appendChild(g);
        ghostRef.current = g;
      }
      g.textContent = d.name;
      g.style.transform = 'translate(' + (ev.clientX + 12) + 'px,' + (ev.clientY - 14) + 'px)';
    }

    function onChipPointerUp(ev) {
      var d = dragRef.current;
      if (!d || d.id !== ev.pointerId) return;
      dragRef.current = null;
      if (ghostRef.current) { ghostRef.current.remove(); ghostRef.current = null; }
      setDragging(null);
      if (!d.moved) {
        if (adjustMode) { adjustCount(d.name, adjustMode); return; }
        toggleLock(d.name);
        return;
      }
      var el = document.elementFromPoint(ev.clientX, ev.clientY);
      var zone = el && el.closest ? el.closest('[data-drop]') : null;
      if (!zone) return;
      var addr = parseDrop(zone.getAttribute('data-drop'));
      var r = zone.getBoundingClientRect();
      place(d.name, addr, (ev.clientX - r.left) / r.width, (ev.clientY - r.top) / r.height);
    }

    /* 自動挑人：等待最久的優先；剛剛同場過的人不再湊在一起。
       候補人數不夠時放寬硬規則，寧可有球打也不要空場。 */
    function levelOf(n) { return Number((detail[n] || {}).level) || 0; }

    /* 程度均衡：先取等最久的一段當候選，再從中選程度最接近的四人。
       候選窗只開 need*2，否則「程度接近」會把等很久的人一直往後推。 */
    function pickByLevel(avail, need) {
      var win = avail.slice(0, Math.min(avail.length, need * 2));
      if (win.length <= need) return win.slice(0, need);
      var sorted = win.slice().sort(function (a, b) { return levelOf(a) - levelOf(b); });
      var best = null, bestSpread = Infinity;
      for (var i = 0; i + need <= sorted.length; i++) {
        var group = sorted.slice(i, i + need);
        var spread = levelOf(group[group.length - 1]) - levelOf(group[0]);
        if (spread < bestSpread) { bestSpread = spread; best = group; }
      }
      return best || win.slice(0, need);
    }

    /* 強弱分隊：最強配最弱、中間兩位一隊。只有剛好四人時適用。 */
    function balanceOrder(names) {
      if (names.length !== 4) return names;
      var s = names.slice().sort(function (a, b) { return levelOf(b) - levelOf(a); });
      return [s[0], s[3], s[1], s[2]];
    }

    function pickNext(st, pairs, seq, need, seed) {
      if (autoMode === 'off' || need <= 0) return [];
      var taken = {};
      st.courts.forEach(function (c) { membersOf(c).forEach(function (n) { taken[n] = 1; }); });
      st.queue.forEach(function (q) { membersOf(q).forEach(function (n) { taken[n] = 1; }); });
      st.resting.forEach(function (n) { taken[n] = 1; });
      // seed 是已經確定要上這一場的人（續戰的＋排隊已取出的），必須排除，
      // 否則他們還沒被放回場地時會被當成待命而重複挑中。
      var avail = going.filter(function (r) {
        return !taken[r.nickname] && (seed || []).indexOf(r.nickname) < 0 && !isLocked(r.nickname);
      }).map(function (r) { return r.nickname; });
      avail.sort(function (a, b) {
        var wa = sinceMap[a] || 0, wb = sinceMap[b] || 0;
        if (wa !== wb) return wa - wb;
        return (stats[a] || 0) - (stats[b] || 0);
      });
      if (autoMode === 'fair') return avail.slice(0, need);
      if (autoMode === 'level') return pickByLevel(avail, need);
      function fresh(chosen, cand) {
        var all = (seed || []).concat(chosen);
        for (var i = 0; i < all.length; i++) {
          if (pairs[pairKey(all[i], cand)] === seq) return false;
        }
        return true;
      }
      var picked = [];
      for (var i = 0; i < avail.length && picked.length < need; i++) {
        if (fresh(picked, avail[i])) picked.push(avail[i]);
      }
      for (var k = 0; k < avail.length && picked.length < need; k++) {
        if (picked.indexOf(avail[k]) < 0) picked.push(avail[k]);
      }
      return picked;
    }

    /* 換場：排隊 1 上場、後面整排往前移，下場的人自動排到隊尾。
       放隊尾而不是排隊 1，剛打完的才不會馬上又輪到。
       鎖定只影響自動挑人，換場時場上的人一律下場。 */
    function swapCourt(courtNum) {
      var st = snapshotState();
      var c = st.courts.find(function (x) { return x.courtNum === courtNum; });
      if (!c) return;
      var played = membersOf(c);
      var seq = (Number(baseLineup.matchSeq) || 0) + 1;
      var nextStats = Object.assign({}, stats);
      var nextPairs = Object.assign({}, baseLineup.pairs || {});
      played.forEach(function (n) { nextStats[n] = (nextStats[n] || 0) + 1; });
      for (var i = 0; i < played.length; i++) {
        for (var j = i + 1; j < played.length; j++) nextPairs[pairKey(played[i], played[j])] = seq;
      }

      // 比照 App 實機行為：鎖定只擋「自動排場」，換場是手動操作，場上的人全部下場
      var keep = [];
      var leaving = played.slice();
      leaving.forEach(function (n) { pluck(st, n); });
      var need = 4 - keep.length;

      // 排隊 1 先上；名單要在 pluck 之前複製出來
      var q0 = st.queue[0] || { teamA: [], teamB: [] };
      var queued = (q0.teamA || []).filter(Boolean).concat((q0.teamB || []).filter(Boolean));
      var incoming = [];
      if (need > 0 && queued.length) {
        incoming = queued.slice(0, need);
        incoming.forEach(function (n) { pluck(st, n); });
      }
      if (incoming.length < need) {
        // leaving 也要排除：他們此刻已被 pluck 出場地、還沒排進隊尾，
        // 不擋掉的話會被當成待命最久的人立刻挑回場上。
        var more = pickNext(st, nextPairs, seq, need - incoming.length, keep.concat(incoming).concat(leaving));
        more.forEach(function (n) { pluck(st, n); });
        incoming = incoming.concat(more);
      }

      // 輸送帶前移一格，空出隊尾給剛下場的人
      st.queue.shift();
      st.queue.push(emptySlot(st.queue.length));

      // 程度均衡管的是「怎麼分隊」，所以來自排隊的組合也要重排——
      // 否則輸送帶一轉起來，上場的人幾乎都來自排隊，這個模式就完全不作用了。
      // 代價是它會覆蓋你在排隊裡排好的隊形；不想被動就用其他三種模式。
      if (autoMode === 'level' && !keep.length) incoming = balanceOrder(incoming);
      var onCourt = keep.concat(incoming);
      var target = st.courts.find(function (x) { return x.courtNum === courtNum; });
      target.teamA = []; target.teamB = [];
      onCourt.forEach(function (n, i) {
        var p = (keep.indexOf(n) >= 0 && st.pos[n]) ? st.pos[n] : defaultPos(i);
        st.pos[n] = p;
        (p.y > 0.5 ? target.teamB : target.teamA).push(n);
      });
      target.status = onCourt.length >= 4 ? 'playing' : 'idle';
      target.matchStart = onCourt.length >= 4 ? new Date().toISOString() : null;

      // 剛下場的人排到隊尾，沒人會因為不好意思而被漏掉
      var tail = st.queue[st.queue.length - 1];
      leaving.forEach(function (n, i) {
        var p = defaultPos(i);
        st.pos[n] = p;
        (p.y > 0.5 ? tail.teamB : tail.teamA).push(n);
      });

      if (incoming.length) {
        var where = (target.label || ('場地 ' + courtNum));
        var msg = prefs.pairAnnounce && target.teamA.length && target.teamB.length
          ? where + '，' + target.teamA.join('、') + ' 對 ' + target.teamB.join('、') + '，請上場'
          : where + '，請 ' + incoming.join('、') + ' 上場';
        var nextUp = membersOf(st.queue[0]);
        if (prefs.preAnnounce && nextUp.length) msg += '。下一組 ' + nextUp.join('、') + ' 請準備';
        speak(msg);
      }
      saveLineup(buildLineup(st, { stats: nextStats, pairs: nextPairs, matchSeq: seq }));
    }

    function setLabel(courtNum, value) {
      var st = snapshotState();
      st.courts = st.courts.map(function (x) {
        if (x.courtNum !== courtNum) return x;
        return Object.assign({}, x, { label: value.slice(0, 20) });
      });
      saveLineup(buildLineup(st));
    }

    function cycleMode() {
      if (!me || busy) return;
      var i = 0;
      for (var k = 0; k < AUTO_MODES.length; k++) if (AUTO_MODES[k].key === autoMode) i = k;
      var next = AUTO_MODES[(i + 1) % AUTO_MODES.length];
      saveLineup(Object.assign({}, baseLineup, { autoMode: next.key }));
    }

    function undo() {
      if (!history.length || !me || busy) return;
      var prev = history[history.length - 1];
      var cur = clone(baseLineup);
      setHistory(function (old) { return old.slice(0, -1); });
      setFuture(function (old) { return old.concat([cur]); });
      saveLineup(prev, true);
    }

    function redo() {
      if (!future.length || !me || busy) return;
      var next = future[future.length - 1];
      var cur = clone(baseLineup);
      setFuture(function (old) { return old.slice(0, -1); });
      setHistory(function (old) { return old.concat([cur]).slice(-10); });
      saveLineup(next, true);
    }

    /* 計時與場次重置：清掉統計與計時，但人留在原位，方便同一天接著打第二輪。 */
    function resetSession() {
      if (!me || busy) return;
      if (!window.confirm('重置所有計時、場次與出場記錄？人員位置會保留。')) return;
      var st = snapshotState();
      st.courts = st.courts.map(function (c) {
        return Object.assign({}, c, { status: 'idle', matchStart: null });
      });
      saveLineup(Object.assign({}, baseLineup, {
        courts: st.courts, queue: st.queue, resting: st.resting, pos: st.pos,
        stats: {}, times: {}, since: {}, state: {}, pairs: {}, matchSeq: 0
      }));
      setFuncOpen(false);
    }

    /* 場數存在活動本身（activeEvent.courts），不在 lineup，所以要走 saveEvent。
       整份 row 從 /api/state 取，不能用 /api/public 的版本——那份會把舊活動的門禁 QR 清空。 */
    function changeCourts(delta) {
      if (!me || !activeEvent || busy) return;
      var next = Math.min(12, Math.max(1, numCourts + delta));
      if (next === numCourts) return;
      setBusy(true);
      setErr('');
      fetch('/api/state').then(function (r) {
        if (!r.ok) throw new Error('讀取狀態失敗');
        return r.json();
      }).then(function (stt) {
        var ev = (stt.events || []).find(function (x) { return x.id === activeEvent.id; });
        if (!ev) throw new Error('找不到活動');
        return fetch('/api/action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            version: stt.version, action: 'saveEvent', id: activeEvent.id,
            row: Object.assign({}, ev, { courts: next })
          })
        });
      }).then(function (r) {
        return r.json().then(function (res) {
          if (!r.ok || res.error) throw new Error(res.error || '場數更新失敗');
        });
      }).then(function () { setBusy(false); refresh(); })
        .catch(function (e) { setBusy(false); setErr(e.message || '場數更新失敗'); refresh(); });
    }

    function buildReport() {
      var stamp = Date.now();
      var lines = ['羽球活動記錄', activeEvent.title,
        (activeEvent.dateText || '') + '　' + (activeEvent.place || ''), '',
        '共換場 ' + (Number(baseLineup.matchSeq) || 0) + ' 次',
        '排場模式：' + modeAt(autoMode).label,
        '匯出時間：' + new Date().toLocaleString('zh-TW'),
        '------------------------------------------',
        '球員出場記錄'];
      going.slice().sort(function (a, b) {
        return (stats[b.nickname] || 0) - (stats[a.nickname] || 0);
      }).forEach(function (r) {
        var n = r.nickname;
        var t = Object.assign({ play: 0, wait: 0, rest: 0 }, timesMap[n]);
        // 目前這一段還沒結算，加上去才是真實累計
        var cur = stateMap[n];
        if (cur && sinceMap[n]) t[cur] = (t[cur] || 0) + (stamp - sinceMap[n]);
        lines.push(n + '　' + (stats[n] || 0) + ' 場 | 上場 ' + hms(t.play) +
          ' | 等待 ' + hms(t.wait) + ' | 休息 ' + hms(t.rest));
      });
      return lines.join('\n');
    }

    function waitLabel(name) {
      if (stateMap[name] === 'play' || !sinceMap[name]) return null;
      return Math.max(0, Math.floor((nowTime - sinceMap[name]) / 60000)) + ' 分';
    }

    function barColor(d) {
      if (prefs.levelColor) return LEVEL_COLORS[Number(d.level) || 0] || LEVEL_COLORS[0];
      if (prefs.gender) return d.gender === 'female' ? '#F48FB1' : d.gender === 'male' ? '#4FC3F7' : '#F5F5F5';
      return null;
    }

    function chip(name, positioned, idx) {
      var d = detail[name] || {};
      var cls = 'chip';
      if (isLocked(name)) cls += ' locked';
      if (dragging === name) cls += ' ghosting';
      var wait = prefs.wait ? waitLabel(name) : null;
      var style = null;
      if (positioned) {
        var p = posMap[name] || defaultPos(idx);
        style = { left: (p.x * 100) + '%', top: (p.y * 100) + '%' };
      }
      var bar = barColor(d);
      var meta = [];
      if (prefs.count) meta.push(S('', { key: 'c' }, (stats[name] || 0) + ' 場'));
      if (wait) meta.push(S('w ' + waitTone(parseInt(wait, 10)), { key: 'w' }, wait));
      if (prefs.level && d.level) meta.push(S('lv', { key: 'l' }, 'Lv' + d.level));
      return D(cls, {
        key: name,
        style: style,
        'data-chip': name,
        title: me ? '拖曳移動，輕觸鎖定' : '',
        onPointerDown: function (ev) { onChipPointerDown(name, ev); },
        onPointerMove: onChipPointerMove,
        onPointerUp: onChipPointerUp,
        onPointerCancel: onChipPointerUp
      },
        bar ? S('bar', { style: { background: bar } }) : S('', null),
        S('nm', name),
        meta.length ? D('meta', meta) : null
      );
    }

    /* 球場線：黃色外框＋白色邊線、發球線與中線，比照 App 的場地圖 */
    function courtLines(faint) {
      var y = faint ? 'rgba(220,240,210,.28)' : 'var(--court-yellow)';
      var w = faint ? 'var(--slot-line)' : 'var(--court-line)';
      function L(x1, y1, x2, y2, c) {
        return E('line', { x1: x1, y1: y1, x2: x2, y2: y2, stroke: c, strokeWidth: 2, vectorEffect: 'non-scaling-stroke' });
      }
      return E('svg', { className: 'lines', viewBox: '0 0 100 100', preserveAspectRatio: 'none', 'aria-hidden': true },
        E('rect', { x: 7, y: 7, width: 86, height: 86, fill: 'none', stroke: y, strokeWidth: 3, vectorEffect: 'non-scaling-stroke' }),
        L(13, 7, 13, 93, w), L(87, 7, 87, 93, w),
        L(7, 12, 93, 12, w), L(7, 88, 93, 88, w),
        L(7, 34, 93, 34, w), L(7, 64, 93, 64, w),
        L(50, 7, 50, 34, w), L(50, 64, 50, 93, w)
      );
    }

    function restIcons(kind) {
      var f = 'rgba(150,195,225,.45)';
      function stool(cx, cy) {
        return E('g', { key: 's' + cx + cy },
          E('ellipse', { cx: cx, cy: cy, rx: 13, ry: 5, fill: f }),
          E('rect', { x: cx - 10, y: cy + 3, width: 3, height: 15, fill: f }),
          E('rect', { x: cx + 7, y: cy + 3, width: 3, height: 15, fill: f }),
          E('rect', { x: cx - 1.5, y: cy + 3, width: 3, height: 13, fill: f }));
      }
      function cup(cx, cy) {
        return E('g', { key: 'c' + cx + cy },
          E('path', { d: 'M' + (cx - 12) + ' ' + (cy - 8) + ' h24 v10 a12 12 0 0 1 -24 0 z', fill: f }),
          E('circle', { cx: cx + 14, cy: cy - 1, r: 5, fill: 'none', stroke: f, strokeWidth: 3 }));
      }
      if (kind === 'strip') {
        var row = [];
        for (var k = 0; k < 8; k++) row.push(k % 2 ? cup(120 + k * 70, 48) : stool(120 + k * 70, 40));
        return E('svg', { className: 'lines', viewBox: '0 0 700 100', preserveAspectRatio: 'xMidYMid meet', 'aria-hidden': true },
          E('rect', { x: 90, y: 12, width: 590, height: 76, fill: 'none', stroke: 'rgba(220,240,120,.35)', strokeWidth: 3 }), row);
      }
      return E('svg', { className: 'lines', viewBox: '0 0 160 130', preserveAspectRatio: 'xMidYMid meet', 'aria-hidden': true },
        stool(40, 28), cup(118, 30), cup(40, 92), stool(118, 90));
    }

    function icon(kind) {
      var p = { fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' };
      var a = { viewBox: '0 0 24 24', 'aria-hidden': true };
      if (kind === 'auto') return E('svg', a,
        E('path', Object.assign({ d: 'M20 11a8 8 0 0 0-14.3-4.9M4 13a8 8 0 0 0 14.3 4.9' }, p)),
        E('path', Object.assign({ d: 'M5.5 2.5v4h4M18.5 21.5v-4h-4' }, p)),
        E('path', { d: 'M12 8l1.2 2.8L16 12l-2.8 1.2L12 16l-1.2-2.8L8 12l2.8-1.2z', fill: 'currentColor' }));
      if (kind === 'gear') return E('svg', a,
        E('circle', Object.assign({ cx: 12, cy: 12, r: 3 }, p)),
        E('path', Object.assign({ d: 'M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z' }, p)));
      if (kind === 'clock') return E('svg', a,
        E('circle', Object.assign({ cx: 12, cy: 12, r: 9 }, p)), E('path', Object.assign({ d: 'M12 7v5l3 2' }, p)));
      if (kind === 'setup') return E('svg', a,
        E('rect', Object.assign({ x: 7, y: 2, width: 12, height: 20, rx: 2 }, p)),
        E('circle', Object.assign({ cx: 9, cy: 12, r: 2.5 }, p)));
      if (kind === 'timer') return E('svg', a,
        E('circle', Object.assign({ cx: 12, cy: 13, r: 8 }, p)), E('path', Object.assign({ d: 'M12 9v4M10 2h4' }, p)));
      if (kind === 'undo') return E('svg', a, E('path', Object.assign({ d: 'M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3' }, p)));
      if (kind === 'redo') return E('svg', a, E('path', Object.assign({ d: 'M15 14l5-5-5-5M20 9H10a6 6 0 0 0 0 12h3' }, p)));
      if (kind === 'voice') return E('svg', a,
        E('circle', Object.assign({ cx: 9, cy: 8, r: 4 }, p)), E('path', Object.assign({ d: 'M2 21a7 7 0 0 1 14 0M18 5a5 5 0 0 1 0 7M21 3a9 9 0 0 1 0 11' }, p)));
      if (kind === 'log') return E('svg', a,
        E('rect', Object.assign({ x: 8, y: 8, width: 13, height: 13, rx: 2 }, p)), E('path', Object.assign({ d: 'M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3' }, p)));
      if (kind === 'cloud') return E('svg', a,
        E('path', Object.assign({ d: 'M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 7 18z' }, p)), E('path', Object.assign({ d: 'M12 15v-5M9.5 12.5L12 10l2.5 2.5' }, p)));
      return null;
    }

    /* 版面比照 App：依場數換排法，整頁塞進一個橫向螢幕。
       3 面以下：場地＋休息區同一排，排隊一排；4 面：排隊一排、休息區在最下面一條；
       5 面以上：排隊兩排，休息區佔右下兩欄。 */
    function layoutFor(n) {
      var L = { cols: n + 1, rows: '1.3fr 1fr', court: [], queue: [], rest: null, restKind: 'side' };
      var i;
      if (n <= 3) {
        for (i = 0; i < n; i++) L.court.push({ c: i + 1, r: 1 });
        for (i = 0; i < n + 1; i++) L.queue.push({ c: i + 1, r: 2 });
        L.rest = { c: n + 1, r: 1 };
      } else if (n === 4) {
        L.cols = 20; L.rows = '1.4fr 1fr .55fr'; L.restKind = 'strip';
        for (i = 0; i < 4; i++) L.court.push({ c: i * 5 + 1, cs: 5, r: 1 });
        for (i = 0; i < 5; i++) L.queue.push({ c: i * 4 + 1, cs: 4, r: 2 });
        L.rest = { c: 1, cs: 20, r: 3 };
      } else {
        var qc = n - 2;
        L.cols = n; L.rows = '1.1fr 1fr 1fr'; L.restKind = 'block';
        for (i = 0; i < n; i++) L.court.push({ c: i + 1, r: 1 });
        for (i = 0; i < n + 1; i++) L.queue.push({ c: (i % qc) + 1, r: 2 + Math.floor(i / qc) });
        L.rest = { c: n - 1, cs: 2, r: 2, rs: 2 };
      }
      return L;
    }
    function cell(p) {
      return { gridColumn: p.c + ' / span ' + (p.cs || 1), gridRow: p.r + ' / span ' + (p.rs || 1) };
    }

    function courtCol(c, place) {
      var ms = c.matchStart ? Date.parse(c.matchStart) : 0;
      var elapsed = ms ? Math.max(0, Math.floor((nowTime - ms) / 1000)) : 0;
      var names = membersOf(c);
      var q0ready = membersOf(queue[0]).length;
      var shown = c.status === 'playing' ? elapsed : 0;
      return D('col', { key: 'c' + c.courtNum, style: cell(place) },
        D('canvas' + (dragging ? ' drop' : ''), { 'data-drop': 'court:' + c.courtNum },
          courtLines(false),
          E('input', {
            className: 'zname',
            value: labelDraft.current[c.courtNum] != null ? labelDraft.current[c.courtNum] : (c.label || ('場地 ' + c.courtNum)),
            disabled: !me,
            'aria-label': '場地 ' + c.courtNum + ' 名稱',
            onChange: function (ev) { labelDraft.current[c.courtNum] = ev.target.value; setNowTime(Date.now()); },
            onBlur: function (ev) {
              var v = ev.target.value.trim();
              delete labelDraft.current[c.courtNum];
              if (v !== (c.label || '')) setLabel(c.courtNum, v);
            }
          }),
          S('hand', '✋'),
          names.map(function (n, i) { return chip(n, true, i); })
        ),
        D('ctlrow',
          prefs.timer ? D('timer ' + timerTone(shown), mmss(shown)) : null,
          E('button', {
            className: 'swapbtn', type: 'button', disabled: !me || busy,
            title: q0ready ? '換上排隊 1' : modeAt(autoMode).hint,
            onClick: function () { swapCourt(c.courtNum); }
          }, c.courtNum + ' 場下')
        )
      );
    }

    function controls() {
      return D('ctl',
        D('btns',
          E('button', {
            className: 'round m-' + modeAt(autoMode).tone, type: 'button', disabled: !me || busy,
            title: modeAt(autoMode).hint, 'aria-label': '切換排場模式', onClick: cycleMode
          }, icon('auto')),
          E('button', {
            className: 'round' + (adjustMode === 1 ? ' armed' : ''), type: 'button', disabled: !me || busy,
            'aria-label': '上場次數加一', 'aria-pressed': adjustMode === 1,
            title: '按下後點一位球員，他的上場次數 +1',
            onClick: function () { setAdjustMode(adjustMode === 1 ? 0 : 1); }
          }, '+1'),
          E('button', {
            className: 'round' + (adjustMode === -1 ? ' armed' : ''), type: 'button', disabled: !me || busy,
            'aria-label': '上場次數減一', 'aria-pressed': adjustMode === -1,
            title: '按下後點一位球員，他的上場次數 −1',
            onClick: function () { setAdjustMode(adjustMode === -1 ? 0 : -1); }
          }, '−1'),
          E('button', { className: 'round gear', type: 'button', 'aria-label': '功能按鈕', onClick: function () { setFuncOpen(true); } }, icon('gear'))
        ),
        D('modetext', (autoMode === 'off' ? 'Auto：' : 'AI Auto：') + modeAt(autoMode).label)
      );
    }

    function restCol(place, kind) {
      var clockNow = new Date(nowTime);
      return D('col rest-' + kind, { key: 'rest', style: cell(place) },
        D('canvas rest' + (dragging ? ' drop' : ''), { 'data-drop': 'rest' },
          restIcons(kind),
          D('zname', '休息區'),
          D('clock', icon('clock'), pad2(clockNow.getHours()) + ':' + pad2(clockNow.getMinutes()) + ':' + pad2(clockNow.getSeconds())),
          resting.map(function (n, i) { return chip(n, true, i); })
        ),
        controls()
      );
    }

    function frow(label, kind, onClick, disabled) {
      return D('frow', { key: label },
        S('', label),
        E('button', { className: 'ic', type: 'button', disabled: !!disabled, 'aria-label': label, onClick: onClick }, icon(kind))
      );
    }

    function funcModal() {
      function close() { setFuncOpen(false); }
      return D('modal-bg', { onClick: close },
        D('modal', { onClick: function (ev) { ev.stopPropagation(); } },
          E('button', { className: 'x', type: 'button', 'aria-label': '關閉', onClick: close }, '×'),
          E('h2', null, '功能按鈕'),
          frow('返回設定頁：', 'setup', function () { setFuncOpen(false); setSetupOpen(true); }),
          frow('計時與場次重置：', 'timer', resetSession, !me || busy),
          D('frow', { key: 'console' },
            S('', '長老登入與名冊：'),
            E('a', { className: 'ic', href: '/console.html', 'aria-label': '長老登入與名冊' }, icon('cloud'))),
          frow('回到上一步：' + history.length, 'undo', undo, !me || busy || !history.length),
          frow('重做下一步：' + future.length, 'redo', redo, !me || busy || !future.length),
          frow('語音測試：', 'voice', function () { speak('場地一，請 甲 乙 丙 丁 上場'); }),
          frow('羽球活動記錄：', 'log', function () { setFuncOpen(false); setLogText(buildReport()); })
        )
      );
    }

    function swRow(label, key) {
      return D('prow', { key: key },
        D('lbl', label),
        D('sw' + (prefs[key] ? ' on' : ''), {
          role: 'switch', 'aria-checked': !!prefs[key], 'aria-label': label, tabIndex: 0,
          onClick: function () { var o = {}; o[key] = !prefs[key]; savePrefs(o); }
        })
      );
    }

    function settingsModal() {
      var scale = Number(prefs.scale) || 1;
      function close() { setSetupOpen(false); }
      return D('modal-bg', { onClick: close },
        D('modal setup', { onClick: function (ev) { ev.stopPropagation(); } },
          D('setup-head', '設定',
            E('button', { className: 'x', type: 'button', 'aria-label': '關閉', onClick: close }, '×')),
          D('setup-body',
            D('sect', '顯示設定'),
            swRow('場上進行時間', 'timer'),
            swRow('球員上場次數', 'count'),
            swRow('球員場下等待時間', 'wait'),
            swRow('球員等級數字', 'level'),
            swRow('球員顏色分級', 'levelColor'),
            swRow('性別配色', 'gender'),
            D('sect', '字體設定'),
            D('prow', D('lbl', '字級'),
              E('input', {
                type: 'range', min: 0.7, max: 1.6, step: 0.1, value: scale, 'aria-label': '字級',
                onChange: function (ev) { savePrefs({ scale: Number(ev.target.value) }); }
              }),
              D('fsval', '字級: ' + Math.round(27 * scale))),
            D('sect', '排場設定'),
            me ? D('prow', D('lbl', '場數'),
              E('select', {
                className: 'sel', value: numCourts, disabled: busy, 'aria-label': '場數',
                onChange: function (ev) { changeCourts(Number(ev.target.value) - numCourts); }
              }, [1, 2, 3, 4, 5, 6].concat(numCourts > 6 ? [numCourts] : []).map(function (n) {
                return E('option', { key: n, value: n }, n);
              }))) : null,
            swRow('移動球員自動加鎖', 'autoLock'),
            D('sect', '語音廣播設定'),
            swRow('換場語音廣播', 'voice'),
            D('prow', D('lbl', '語音廣播次數'),
              D('seg', [1, 2, 3].map(function (n) {
                return E('button', {
                  key: n, type: 'button', className: Number(prefs.voiceTimes) === n ? 'on' : '',
                  onClick: function () { savePrefs({ voiceTimes: n }); }
                }, n + '次');
              }))),
            swRow('上場預告廣播', 'preAnnounce'),
            swRow('建議搭檔廣播', 'pairAnnounce')
          )
        )
      );
    }

    if (!data) return D('wrap', D('banner', '正在請出名冊…'));
    if (!activeEvent) return D('wrap', D('banner', '目前沒有集結活動。請先在管理後台開團。'));

    var L = layoutFor(numCourts);
    return D('wrap', { style: { '--chip-fs': 'calc(clamp(13px, 1.75vw, 30px) * ' + (Number(prefs.scale) || 1) + ')' } },
      funcOpen ? funcModal() : null,
      setupOpen ? settingsModal() : null,
      logText ? D('modal-bg', { onClick: function () { setLogText(''); } },
        D('modal log', { onClick: function (ev) { ev.stopPropagation(); } },
          E('h2', null, '羽球活動記錄'),
          E('pre', null, logText),
          D('mfoot',
            E('button', { type: 'button', onClick: function () { try { navigator.clipboard.writeText(logText); } catch (e) {} } }, '複製到剪貼簿'),
            E('button', { type: 'button', onClick: function () { setLogText(''); } }, '關閉')
          )
        )
      ) : null,
      err ? D('banner err', err) : null,
      !me ? D('banner', '訪客唯讀，只能看排場。長老請先到 ', E('a', { href: '/console.html' }, '後台'), ' 登入再回來。') : null,
      D('arena', { style: { gridTemplateColumns: 'repeat(' + L.cols + ', minmax(0, 1fr))', gridTemplateRows: L.rows } },
        courts.map(function (c, i) { return courtCol(c, L.court[i]); }),
        queue.map(function (q, i) {
          return D('qwrap', { key: q.id, style: cell(L.queue[i]) },
            D('canvas slot' + (dragging ? ' drop' : ''), { 'data-drop': 'queue:' + i },
              courtLines(true),
              D('zname', '排隊 ' + (i + 1)),
              S('hand', '✋'),
              membersOf(q).map(function (n, k) { return chip(n, true, k); })
            ),
            D('arrow')
          );
        }),
        restCol(L.rest, L.restKind)
      ),
      adjustMode ? D('banner', '請點一位球員，他的上場次數 ' + (adjustMode > 0 ? '+1' : '−1')) : null,
      D('pool' + (dragging ? ' drop' : ''), { 'data-drop': 'pool' },
        D('pool-head', '待命池', S('n', pool.length + ' 人・等最久的排前面')),
        D('list', pool.length
          ? pool.map(function (p) { return chip(p.nickname, false, 0); })
          : D('empty', '無人待命'))
      )
    );
  }

  var rootEl = document.getElementById('root');
  if (ReactDOM.createRoot) ReactDOM.createRoot(rootEl).render(E(CourtApp));
  else ReactDOM.render(E(CourtApp), rootEl);
})();
</script>
</body>
</html>
