<style>

  @keyframes portal-open{0%{opacity:0;transform:translate(-50%,-50%) scale(.58) rotate(-28deg)}28%{opacity:.92}72%{opacity:.34;transform:translate(-50%,-50%) scale(1.06) rotate(20deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2) rotate(32deg)}}

  @keyframes scroll-unfurl{from{opacity:0;transform:translateY(22px) scaleY(.9);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
  @keyframes orbit{to{transform:rotate(360deg)}}

  @keyframes cloud-drift-b{from{transform:translate3d(6%,4%,0) scale(1.08)}to{transform:translate3d(-6%,-3%,0) scale(1)}}
  @keyframes roster-arrive{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}} @keyframes seal-sweep{to{transform:translateX(220%)}}
  .cloud-bank{position:fixed;z-index:-1;pointer-events:none;width:58vw;height:24vw;min-width:32rem;min-height:14rem;border-radius:50%;filter:blur(30px);opacity:.18;will-change:transform}.cloud-bank.one{left:-20vw;top:12vh;background:radial-gradient(ellipse,rgba(155,195,174,.42),rgba(155,195,174,.08) 42%,transparent 72%);animation:cloud-drift-a 60s ease-in-out infinite alternate}.cloud-bank.two{right:-24vw;bottom:4vh;background:radial-gradient(ellipse,rgba(120,151,181,.35),rgba(201,169,97,.08) 42%,transparent 72%);animation:cloud-drift-b 90s ease-in-out infinite alternate}

  @media(max-width:340px){.top-actions{gap:.3rem}.theme-toggle{min-width:34px;width:34px;height:34px}.ro{width:32px;height:32px;justify-content:center;padding:0;font-size:0}}

  /* masthead */

  .eyebrow{

  .flow{height:6px;border-radius:999px;background:rgba(228,235,232,.055);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.34)}.flow i{position:relative;display:block;height:100%;border-radius:inherit;background-position:left center;transition:width .55s var(--ease)}.flow i::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(112deg,transparent 0 11px,rgba(255,255,255,.22) 14px,transparent 18px 28px);transform:translateX(-28px);animation:qi-current 2.4s linear infinite}.flow i::after{content:"";position:absolute;right:-1px;top:50%;width:7px;height:7px;border-radius:50%;transform:translateY(-50%);background:#EAF8F0;box-shadow:0 0 5px 1px rgba(213,231,220,.9),0 0 13px 3px var(--flow-glow,rgba(155,195,174,.55))}.flow.is-near i::after,.flow.is-full i::after{background:#FFF1B8;box-shadow:0 0 6px 1px rgba(255,241,184,.95),0 0 17px 5px rgba(201,169,97,.55);animation:qi-pulse 1.8s ease-in-out infinite}.flow.is-full{box-shadow:inset 0 1px 2px rgba(0,0,0,.34),0 0 16px -6px rgba(201,169,97,.72)}.flow.is-empty i::after{display:none}@keyframes qi-current{to{transform:translateX(0)}}@keyframes qi-pulse{50%{opacity:.58;transform:translateY(-50%) scale(.72)}}

  .disclosure>summary{display:flex;align-items:center;justify-content:space-between;gap:.75rem;min-height:48px;padding:.7rem .9rem;cursor:pointer;list-style:none;color:var(--mist-1);font-family:'Noto Serif TC',Georgia,serif;font-weight:600;font-size:.9rem}
  .disclosure>summary::-webkit-details-marker{display:none}.disclosure>summary::after{content:'⌄';color:var(--jade-300);font-family:'Noto Sans TC',sans-serif;transition:transform .22s var(--ease)}.disclosure[open]>summary::after{transform:rotate(180deg)}
  .disclosure-body{padding:0 1rem 1rem}.disclosure .rule:first-child{border-top:1px solid var(--hair)}

  /* roster */

  .roster-h .n{font-family:'Noto Serif TC',Georgia,serif;font-size:1.2rem;font-weight:700;color:var(--mist-1);margin:.7rem 0 0}

  .grp{margin-top:1.2rem}

  .names{list-style:none;margin:.75rem 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr));gap:.5rem}
  .names li{
    display:flex;align-items:center;gap:.55rem;padding:.55rem .7rem;border-radius:14px;
    background:linear-gradient(180deg,rgba(228,235,232,.04),rgba(228,235,232,.015));
    border:1px solid var(--hair);font-size:.88rem;color:var(--mist-1);font-weight:500;animation:roster-arrive .18s var(--ease) both;animation-delay:var(--entry-delay,0ms);
  }
  @property --realm-angle{syntax:"<angle>";inherits:false;initial-value:0deg}.realm-badge{--realm-angle:0deg;position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:.3rem;overflow:hidden;padding:.17rem .55rem;border:1px solid transparent;border-radius:999px;color:var(--realm-text);font:600 11px 'Noto Serif TC',Georgia,serif;letter-spacing:.04em;text-shadow:0 0 10px var(--realm-glow);background:linear-gradient(180deg,rgba(15,27,29,.96),rgba(9,17,19,.96)) padding-box,conic-gradient(from var(--realm-angle),var(--realm-a),var(--realm-b),var(--realm-c),var(--realm-a)) border-box;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 0 18px -7px var(--realm-glow);animation:realm-border var(--realm-speed,12s) linear infinite,realm-aura 3.6s ease-in-out infinite}.realm-badge::before{content:"";position:absolute;inset:1px;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at 18% 0%,var(--realm-glow),transparent 42%);opacity:.2}.realm-badge::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(108deg,transparent 34%,rgba(255,255,255,.34) 49%,transparent 64%);transform:translateX(-145%);animation:realm-sheen var(--realm-sheen,6s) var(--ease) infinite}@keyframes realm-border{to{--realm-angle:360deg}}@keyframes realm-aura{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 22px -5px var(--realm-glow)}}@keyframes realm-sheen{0%,68%{transform:translateX(-145%);opacity:0}76%{opacity:.72}100%{transform:translateX(145%);opacity:0}}.realm-qi{--realm-a:#6E9E88;--realm-b:#D5E7DC;--realm-c:#35594B;--realm-text:#CDE9DA;--realm-glow:rgba(155,195,174,.62);--realm-speed:9s;--realm-sheen:6s}.realm-foundation{--realm-a:#5C8B99;--realm-b:#D8F2F7;--realm-c:#385E69;--realm-text:#C9E5ED;--realm-glow:rgba(129,202,220,.68);--realm-speed:12s;--realm-sheen:7s}.realm-golden{--realm-a:#8A6824;--realm-b:#FFF0AE;--realm-c:#C3912D;--realm-text:#FFE8A0;--realm-glow:rgba(226,184,78,.78);--realm-speed:15s;--realm-sheen:8s}.realm-nascent{--realm-a:#6A5596;--realm-b:#E5DBFF;--realm-c:#9E8FC0;--realm-text:#E8DFFF;--realm-glow:rgba(174,145,235,.78);--realm-speed:19s;--realm-sheen:9s}.realm-transcendent{--realm-a:#7F5B13;--realm-b:#FFF7C8;--realm-c:#D6A93D;--realm-text:#FFF2B5;--realm-glow:rgba(255,205,88,.92);--realm-speed:24s;--realm-sheen:10s}
  .names .i{font-size:.7rem;color:var(--mist-3);min-width:1.1rem;text-align:right;font-variant-numeric:tabular-nums}
  .names .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .none{margin:.6rem 0 0;font-size:.78rem;color:var(--mist-3)}

  .empty{border:1px dashed var(--hair-2);border-radius:20px;padding:2.6rem 1rem;text-align:center;color:var(--mist-3);font-size:.85rem;margin-top:1rem}
  .foot{margin:1.8rem 0 3rem;padding:1.2rem;border-radius:20px;
    background:linear-gradient(180deg,rgba(228,235,232,.03),rgba(228,235,232,.012));
    border:1px solid var(--hair);font-size:.79rem;color:var(--mist-3);line-height:1.8}
  .foot strong{color:var(--mist-2)}

  .event-card{position:relative;overflow:hidden;transition:border-color .3s var(--ease),box-shadow .3s var(--ease),transform .3s var(--ease);transform-origin:center}.event-card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(18rem circle at var(--mx,50%) var(--my,20%),rgba(211,237,222,.13),transparent 38%);transition:opacity .2s var(--ease)}.event-card.reveal-wait{opacity:0;transform:translateY(22px) scaleY(.9);filter:blur(3px)}.event-card.reveal-in{animation:scroll-unfurl .44s var(--ease) both}@media (hover:hover) and (pointer:fine){.event-card.reveal-in:hover{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-3px);border-color:rgba(155,195,174,.27);box-shadow:0 24px 42px -31px rgba(0,0,0,.92),0 0 0 1px rgba(155,195,174,.08)}.event-card:hover::after{opacity:1}}.full-seal{position:absolute;right:-2.15rem;top:1.15rem;z-index:2;width:9rem;transform:rotate(38deg);overflow:hidden;padding:.26rem .5rem;text-align:center;letter-spacing:.22em;color:#382B0E;background:linear-gradient(180deg,#F0D783,#C9A961);box-shadow:0 5px 18px -8px rgba(201,169,97,.9);font:700 11px 'Noto Serif TC',serif}.full-seal::after{content:"";position:absolute;inset:0;transform:translateX(-120%);background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.72),transparent 66%);animation:seal-sweep 3.8s ease-in-out infinite}
  .action-row{display:flex;flex-wrap:wrap;align-items:center;gap:.55rem;margin-top:.85rem}
  .action-row .share{margin-top:0}
  .signup{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.45rem 1rem;border:0;border-radius:999px;color:#08120e;background:linear-gradient(180deg,#A8CFBA,#6E9E88);font:700 .76rem 'Noto Sans TC',sans-serif;cursor:pointer;box-shadow:0 12px 28px -16px rgba(110,158,136,.9);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
  .signup:hover{transform:translateY(-1px);box-shadow:0 15px 30px -14px rgba(110,158,136,1)}
  .signup:focus-visible{outline:2px solid var(--jade-100);outline-offset:3px}
  .recruit{display:inline-flex;align-items:center;gap:.4rem;min-height:30px;padding:.2rem .65rem;border-radius:999px;font-size:.7rem;font-weight:600;border:1px solid var(--hair-2);color:var(--jade-300);background:rgba(155,195,174,.06)}
  .recruit.closed{color:var(--mist-3);background:rgba(228,235,232,.025)}
  .recruit.urgent{color:var(--cinnabar);border-color:rgba(208,122,108,.24);background:rgba(208,122,108,.06)}
  .qi-ring{position:absolute;right:1rem;top:1rem;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--jade-300) var(--qi),rgba(228,235,232,.065) 0);box-shadow:0 0 26px -12px rgba(155,195,174,.8)}
  .qi-ring::before{content:"";position:absolute;inset:-5px;border:1px solid rgba(201,169,97,.34);border-radius:50%;box-shadow:0 0 16px -7px rgba(201,169,97,.8);animation:ring-breathe 2.8s ease-in-out infinite}@keyframes ring-breathe{50%{opacity:.45;transform:scale(1.08)}}
  .qi-ring::after{content:"";position:absolute;z-index:1;inset:5px;border-radius:50%;background:var(--ink-1)}

  html[data-theme="light"]{--ink-0:#E8E0D1;--ink-1:#F3EDE1;--mist-1:#24382F;--mist-2:#4A6056;--mist-3:#61756C;--jade-100:#174737;--jade-300:#2E7055;--jade-500:#477E65;--jade-700:#285C48;--gold:#8C651C;--cinnabar:#A64E41;--amethyst:#66558D;--hair:rgba(76,65,45,.16);--hair-2:rgba(57,82,68,.27);color-scheme:light}
  html[data-theme="light"] body::before{background:radial-gradient(52% 38% at 16% 8%,rgba(83,128,98,.18),transparent 64%),radial-gradient(42% 32% at 86% 4%,rgba(181,135,52,.17),transparent 62%),radial-gradient(66% 48% at 54% 102%,rgba(135,103,57,.11),transparent 66%)}
  html[data-theme="light"] body::after{background:radial-gradient(128% 84% at 50% -4%,transparent 38%,rgba(132,105,65,.13) 100%)}
  html[data-theme="light"] .grain{opacity:.018;mix-blend-mode:multiply}
  html[data-theme="light"] .topbar{background:rgba(239,232,218,.92)}
  html[data-theme="light"] .mark{filter:drop-shadow(0 7px 10px rgba(31,107,85,.16))}
  html[data-theme="light"] .card{background:linear-gradient(180deg,rgba(247,242,232,.98),rgba(234,225,208,.97));box-shadow:inset 0 1px 0 rgba(255,253,247,.76),0 18px 42px -34px rgba(79,61,35,.42)}
  html[data-theme="light"] .inlay,html[data-theme="light"] .seal,html[data-theme="light"] .box,html[data-theme="light"] .roster-row{background:linear-gradient(180deg,rgba(240,233,219,.94),rgba(222,211,191,.80))}
  html[data-theme="light"] .stat-main{background:linear-gradient(150deg,rgba(82,132,101,.19),rgba(239,231,216,.82))}
  html[data-theme="light"] .share,html[data-theme="light"] .theme-toggle{background:rgba(239,231,215,.88)}
  html[data-theme="light"] .ro{background:linear-gradient(180deg,rgba(62,119,91,.15),rgba(236,227,210,.84))}
  html[data-theme="light"] .flow{background:rgba(34,83,62,.1);box-shadow:inset 0 1px 2px rgba(30,70,54,.14)}
  html[data-theme="light"] .cloud-bank{opacity:.1}
  .qi-ring span{position:relative;z-index:2;font:600 10px 'Noto Serif TC',serif;color:var(--jade-100)}
  .stat-main{position:relative}
  .venue-extra{margin-top:.9rem;padding-top:.9rem;border-top:1px solid var(--hair);font-size:.76rem;color:var(--mist-2);line-height:1.8}
  .venue-extra a{color:var(--jade-300);font-weight:600;text-decoration:none}
  .masthead,#app,.foot{animation:sect-arrive .7s var(--ease) both}#app{animation-delay:.12s}.foot{animation-delay:.22s}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}body::before,.entry-portal,.qi-ring::before,.cloud-bank,.realm-badge::before,.realm-badge::after,.flow i::before,.flow i::after,.full-seal::after{animation:none}.entry-portal{display:none}.event-card::after{display:none}}

<body>
<!-- ===== 青竹蜂雲劍 · 入陣禮 ===== -->
<style id="rite-style">
  #rite{
    position:fixed;inset:0;z-index:400;overflow:hidden;cursor:pointer;
    --rite-core:#EDFFF6;--rite-jade:#9BC3AE;--rite-deep:#1F6B55;
    --rite-cyan:#4BB5BD;--rite-gold:#C9A961;--rite-void:#6A52C4;
    --rite-flare:#FFFFFF;
    --rite-wash:rgba(237,255,246,.2);
    /* 空間裂縫：裂口本身是暗的，靠鋒緣發光撐出形狀 */
    --rite-tear:#07031A;--rite-rim:#E4FDF0;--rite-rim-glow:#5FC79A;
    /* 劍的配色走 CSS 變數，兩種主題才能各自調到看得清楚 */
    --blade-1:#0C3226;--blade-2:#3E8D6C;--blade-3:#E6FCF0;--blade-4:#5CB289;--blade-5:#0A2C21;
    --grip-1:#0F2A21;--grip-2:#2E6049;--grip-3:#0B241C;
    --leaf-1:#1B5442;--leaf-2:#57A882;--leaf-hi:#8FD3B1;
    --node:#08251C;--node-hi:#D6F3E3;--ridge:#EDFFF6;
    --rite-veil:
      radial-gradient(52% 38% at 16% 8%, rgba(110,158,136,.22), transparent 64%),
      radial-gradient(40% 30% at 86% 4%, rgba(201,169,97,.13), transparent 62%),
      radial-gradient(66% 48% at 54% 102%, rgba(72,116,138,.22), transparent 66%),
      linear-gradient(178deg,#0C161A 0%,#070E11 58%,#050A0C 100%);
    transition:opacity .36s var(--ease),visibility .36s var(--ease);
  }
  #rite.is-done{opacity:0;visibility:hidden;pointer-events:none}

  .rite-quake{position:absolute;inset:-26px;will-change:transform}
  #rite.quake .rite-quake{animation:rite-quake .26s cubic-bezier(.3,.05,.2,.98)}
  #rite.quake-hard .rite-quake{animation:rite-quake-hard .38s cubic-bezier(.3,.05,.2,.98)}
  @keyframes rite-quake{
    0%{transform:translate3d(0,0,0) scale(1)}
    18%{transform:translate3d(-11px,7px,0) scale(1.012)}
    40%{transform:translate3d(9px,-8px,0) scale(1.008)}
    62%{transform:translate3d(-5px,4px,0) scale(1.004)}
    82%{transform:translate3d(2px,-2px,0) scale(1.001)}
    100%{transform:translate3d(0,0,0) scale(1)}
  }
  @keyframes rite-quake-hard{
    0%{transform:translate3d(0,0,0) scale(1) rotate(0)}
    12%{transform:translate3d(-18px,11px,0) scale(1.022) rotate(-.5deg)}
    30%{transform:translate3d(15px,-13px,0) scale(1.016) rotate(.42deg)}
    50%{transform:translate3d(-10px,7px,0) scale(1.01) rotate(-.26deg)}
    70%{transform:translate3d(6px,-4px,0) scale(1.005) rotate(.14deg)}
    88%{transform:translate3d(-2px,1px,0) scale(1.001) rotate(0)}
    100%{transform:translate3d(0,0,0) scale(1) rotate(0)}
  }

  /* 幕：依斬擊線切成數塊，錯開後露出底下的頁面 */
  .rite-shard{
    position:absolute;inset:26px;background-image:var(--rite-veil);
    background-size:100vw 100vh;background-position:0 0;background-repeat:no-repeat;
    will-change:transform,opacity,filter;backface-visibility:hidden;
  }
  .rite-shard.part{animation:rite-part 780ms cubic-bezier(.36,.01,.16,1) forwards;animation-delay:var(--d,0ms)}
  @keyframes rite-part{
    0%{transform:translate3d(0,0,0) rotate(0);opacity:1;filter:blur(0)}
    12%{transform:translate3d(calc(var(--tx) * .05),calc(var(--ty) * .05),0) rotate(calc(var(--rz) * .05));opacity:1}
    70%{opacity:.5}
    100%{transform:translate3d(var(--tx),var(--ty),0) rotate(var(--rz));opacity:0;filter:blur(6px)}
  }

  /* 劍痕是填色的紡錘形，不是等寬線條：中段最寬、兩端收尖，
     這是它看起來像刀口而不是霓虹燈管的主因 */
  .rite-cracks{position:absolute;inset:26px;overflow:visible}
  .crack .aura{fill:var(--rite-deep);opacity:0;filter:blur(26px)}
  .crack .tear{fill:var(--rite-tear);opacity:0}
  .crack .rift{fill:var(--rite-void);opacity:0;filter:blur(12px)}
  /* 鋒緣：描同一條紡錘的外框，自然就是裂口上下兩道發光的邊 */
  .crack .rimglow{fill:none;stroke:var(--rite-rim-glow);stroke-width:6;opacity:0;filter:blur(5px)}
  .crack .rim{fill:none;stroke:var(--rite-rim);stroke-width:1.7;opacity:0;
    filter:drop-shadow(0 0 7px var(--rite-rim-glow))}
  .crack .flare{fill:var(--rite-flare);opacity:0;filter:blur(7px)}
  .crack .spur{fill:none;stroke:var(--rite-rim);stroke-width:1.1;stroke-linecap:round;
    stroke-linejoin:round;opacity:0;filter:drop-shadow(0 0 5px var(--rite-rim-glow))}

  /* 用 animation 而非 transition：背景分頁或慢速裝置上 transition 會卡在起始值，裂縫就畫不出來 */
  .rite-cracks .sweep{transform-box:fill-box;transform-origin:0 50%;
    transform:translate(var(--sx),var(--sy)) rotate(var(--sa)) scaleX(0)}
  .rite-cracks .sweep.go{animation:rite-sweep 105ms cubic-bezier(.04,.92,.18,1) forwards}
  @keyframes rite-sweep{to{transform:translate(var(--sx),var(--sy)) rotate(var(--sa)) scaleX(1)}}
  .crack.cut .tear{opacity:.95}
  .crack.cut .rim{opacity:1;animation:rim-cool 1.6s var(--ease) 105ms forwards}
  .crack.cut .rimglow{opacity:.9;animation:glow-cool 1.6s var(--ease) 105ms forwards}
  .crack.cut .aura{opacity:.5;animation:glow-cool 1.6s var(--ease) 105ms forwards}
  .crack.cut .rift{opacity:.24;animation:rift-breathe 2.4s ease-in-out 105ms infinite}
  .crack.cut .spur{opacity:.85;animation:glow-cool 1.6s var(--ease) 240ms forwards}
  /* 命中當下的白熱爆閃，是「狠」的主要來源 */
  .crack.cut .flare{opacity:0;animation:flare-hit 300ms cubic-bezier(.15,.75,.25,1) forwards}
  @keyframes flare-hit{0%{opacity:.95}22%{opacity:.8}100%{opacity:0}}
  @keyframes rim-cool{0%{opacity:1}100%{opacity:.8}}
  @keyframes glow-cool{100%{opacity:.4}}
  @keyframes rift-breathe{0%,100%{opacity:.16}50%{opacity:.34}}
  /* 幕開始裂開時，裂口的暗色要讓開，才看得到底下的頁面 */
  #rite.parting .crack .tear{animation:tear-open 620ms var(--ease) forwards}
  #rite.parting .crack .rift{animation:tear-open 620ms var(--ease) forwards}
  @keyframes tear-open{to{opacity:0}}

  /* 劍成的法陣 */
  .rite-stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:grid;place-items:center;pointer-events:none}
  .rite-ring,.rite-ring2,.rite-bloom{position:absolute;border-radius:50%;grid-area:1/1}
  .rite-ring{width:min(46vmin,21rem);height:min(46vmin,21rem);
    border:1px dashed rgba(201,169,97,.52);opacity:0}
  #rite.ignite .rite-ring{animation:ring-in 1s var(--ease) 60ms forwards,orbit 13s linear infinite}
  .rite-ring2{width:min(31vmin,14rem);height:min(31vmin,14rem);
    border:1px solid rgba(155,195,174,.4);opacity:0}
  #rite.ignite .rite-ring2{animation:ring-in 1s var(--ease) 190ms forwards,orbit 9s linear reverse infinite}
  @keyframes ring-in{0%{opacity:0;transform:scale(.52)}55%{opacity:.95}100%{opacity:.5;transform:scale(1)}}
  .rite-bloom{width:min(62vmin,28rem);height:min(62vmin,28rem);opacity:0;
    background:radial-gradient(circle,rgba(155,195,174,.3),rgba(110,158,136,.1) 42%,transparent 70%)}
  #rite.ignite .rite-bloom{animation:bloom-in 1s var(--ease) 60ms forwards}
  @keyframes bloom-in{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}

  /* 青竹蜂雲劍 */
  .rite-sword-wrap{grid-area:1/1;display:grid;place-items:center}
  #rite.ignite .rite-sword-wrap{animation:sword-float 3.4s ease-in-out 600ms infinite}
  @keyframes sword-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .rite-sword{height:min(54vh,25rem);width:auto;opacity:0;overflow:visible;
    filter:drop-shadow(0 0 26px rgba(110,190,150,.55)) drop-shadow(0 0 3px rgba(237,255,246,.75))}
  #rite.ignite .rite-sword{animation:sword-in 500ms cubic-bezier(.2,.8,.24,1) 80ms forwards}
  @keyframes sword-in{
    0%{opacity:0;transform:scale(.8) translateY(18px);filter:drop-shadow(0 0 0 rgba(110,190,150,0)) blur(8px)}
    58%{opacity:1;filter:drop-shadow(0 0 30px rgba(110,190,150,.65)) blur(0)}
    100%{opacity:1;transform:scale(1) translateY(0)}
  }
  #rite.ignite .rite-sword .sheen{animation:sheen 820ms var(--ease) 340ms 1 both}
  @keyframes sheen{0%{transform:translateY(-300px);opacity:0}18%{opacity:.9}100%{transform:translateY(330px);opacity:0}}
  #rite.burst .rite-sword{animation:sword-burst 280ms cubic-bezier(.34,.02,.2,1) forwards}
  #rite.burst .rite-sword-wrap{animation:none}
  @keyframes sword-burst{
    0%{opacity:1;transform:scale(1)}
    22%{opacity:1;transform:scale(1.2);filter:drop-shadow(0 0 54px rgba(232,255,244,1)) brightness(3.2)}
    100%{opacity:0;transform:scale(.34);filter:brightness(3.6)}
  }
  #rite.burst .rite-ring,#rite.burst .rite-ring2,#rite.burst .rite-bloom{
    animation:ring-out 380ms var(--ease) forwards}
  @keyframes ring-out{to{opacity:0;transform:scale(1.55)}}

  /* 蜂雲：碎成一群小劍。先炸開懸停成雲，再streak 竄出去，
     中間那段懸停是讓眼睛真的「看到」它們的關鍵 */
  /* 蜂雲：劍身炸開後化成一群飛劍，直接爆射出去，不停留。
     每把劍後面拖一道劍氣，劍氣才是視覺上真正看得到的東西 */

<script id="rite-js">
(function () {
  var root = document.documentElement;
  var rite = document.getElementById('rite');
  if (!rite) return;

  function dismiss() {
    if (!rite) return;
    root.classList.remove('rite-on');
    rite.classList.add('is-done');
    try { sessionStorage.setItem('luoyun-rite', '1'); } catch (e) {}
    window.setTimeout(function () { if (rite && rite.parentNode) rite.parentNode.removeChild(rite); rite = null; }, 400);
  }

  if (!root.classList.contains('rite-on')) {
    if (rite.parentNode) rite.parentNode.removeChild(rite);
    return;
  }

  var W, H, CUTS, crackEls;
  var veils = rite.querySelector('.rite-veils');
  var cracksSvg = rite.querySelector('.rite-cracks');
  var defs = cracksSvg.querySelector('defs');
  var swarm = rite.querySelector('.rite-swarm');
  var sparkBox = rite.querySelector('.rite-sparks');
  var NS = 'http://www.w3.org/2000/svg';

  /* 固定亂數，讓每次進場的裂縫形狀一致可預期 */
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rand = rng(20260913);

  /* 幾何在版面穩定後才算，寬高才不會少算捲軸 */
  function build() {
  /* 量遮罩本身而不是 window.innerWidth，才不會把捲軸寬度算進去 */
  var box = rite.getBoundingClientRect();
  W = Math.round(box.width) || window.innerWidth;
  H = Math.round(box.height) || window.innerHeight;
  rand = rng(20260913);

  /* 三道斬擊：通過點（視窗比例）、角度、起手方向 */
  CUTS = [
    { px: .52, py: .40, deg: -21, dir: 1 },
    { px: .44, py: .62, deg: 26, dir: -1 },
    { px: .63, py: .50, deg: -74, dir: 1 }
  ].map(function (c) {
    var r = c.deg * Math.PI / 180;
    var dx = Math.cos(r), dy = Math.sin(r);
    var P = [c.px * W, c.py * H];
    return { P: P, d: [dx, dy], n: [-dy, dx], c: -(-dy * P[0] + dx * P[1]), dir: c.dir };
  });

  function side(cut, p) { return cut.n[0] * p[0] + cut.n[1] * p[1] + cut.c; }

  /* 用半平面裁切視窗矩形，得到互不重疊的碎片 */
  function clipHalf(poly, cut, sign) {
    var out = [];
    for (var i = 0; i < poly.length; i++) {
      var p = poly[i], q = poly[(i + 1) % poly.length];
      var dp = sign * side(cut, p), dq = sign * side(cut, q);
      if (dp >= 0) out.push(p);
      if ((dp > 0 && dq < 0) || (dp < 0 && dq > 0)) {
        var t = dp / (dp - dq);
        out.push([p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]);
      }

    return out;
  }
  function area(poly) {
    var a = 0;
    for (var i = 0; i < poly.length; i++) {
      var p = poly[i], q = poly[(i + 1) % poly.length];
      a += p[0] * q[1] - q[0] * p[1];
    }
    return Math.abs(a) / 2;
  }
  function centroid(poly) {
    var x = 0, y = 0;
    poly.forEach(function (p) { x += p[0]; y += p[1]; });

  var rect = [[0, 0], [W, 0], [W, H], [0, H]];
  var pieces = [];
  for (var mask = 0; mask < 8; mask++) {
    var poly = rect;

  var cx = W / 2, cy = H / 2, reach = Math.max(W, H) * 1.35;

      return (p[0] + ox / d * .7).toFixed(2) + 'px ' + (p[1] + oy / d * .7).toFixed(2) + 'px';
    }).join(',');
    el.style.clipPath = 'polygon(' + pts + ')';
    el.style.setProperty('--tx', (vx / len * reach).toFixed(1) + 'px');
    el.style.setProperty('--ty', (vy / len * reach).toFixed(1) + 'px');
    el.style.setProperty('--rz', ((rand() - .5) * 14).toFixed(2) + 'deg');
    /* 離中心越近的碎片先讓開 */
    el.style.setProperty('--d', Math.round(len / Math.max(W, H) * 190) + 'ms');
    veils.appendChild(el);
  });

  cracksSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  cracksSvg.setAttribute('width', W);
  cracksSvg.setAttribute('height', H);

  crackEls = CUTS.map(function (cut, idx) {
    var tMin = -Infinity, tMax = Infinity;
    [[cut.d[0], -cut.P[0], W - cut.P[0]], [cut.d[1], -cut.P[1], H - cut.P[1]]].forEach(function (ax) {
      if (Math.abs(ax[0]) < 1e-6) return;
      var t1 = ax[1] / ax[0], t2 = ax[2] / ax[0];
      tMin = Math.max(tMin, Math.min(t1, t2));
      tMax = Math.min(tMax, Math.max(t1, t2));
    });
    var pad = Math.max(W, H) * .08;
    tMin -= pad; tMax += pad;
    if (cut.dir < 0) { var sw = tMin; tMin = tMax; tMax = sw; }

    function on(t, j) {
      return [cut.P[0] + cut.d[0] * t + cut.n[0] * j, cut.P[1] + cut.d[1] * t + cut.n[1] * j];
    }

    /* 偏移量走「大多筆直、偶爾折一下」的路線，比等距鋸齒更像劍痕 */
    var steps = 26, offs = [], walk = 0;
    for (var i = 0; i <= steps; i++) {
      walk += (rand() < .16 ? (rand() - .5) * 30 : (rand() - .5) * 3.5);
      walk *= .84;
      offs.push(walk * Math.sin(Math.PI * i / steps));
    }

    function pt(p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }
    /* 紡錘形：沿刀痕兩側各偏移 w(u)，中段最寬、兩端收成一點 */
    function spindle(width) {
      var top = [], bot = [];
      for (var i = 0; i <= steps; i++) {
        var u = i / steps;
        var t = tMin + (tMax - tMin) * u;
        var w = width * Math.pow(Math.sin(Math.PI * u), .55);
        top.push(on(t, offs[i] + w));
        bot.push(on(t, offs[i] - w));
      }
      return 'M' + top.map(pt).join('L') + 'L' + bot.reverse().map(pt).join('L') + 'Z';
    }

    /* 沿著主裂縫岔出兩條短叉 */
    var spurs = [];
    for (var s = 0; s < 2; s++) {
      var u0 = .34 + rand() * .32;
      var i0 = Math.round(u0 * steps);
      var base = on(tMin + (tMax - tMin) * u0, offs[i0]);
      var lean = (rand() < .5 ? 1 : -1) * (.5 + rand() * .6);
      var L = (34 + rand() * 52) * (rand() < .5 ? -1 : 1);
      var mid = [base[0] + cut.d[0] * L * .55 + cut.n[0] * lean * 9,
                 base[1] + cut.d[1] * L * .55 + cut.n[1] * lean * 9];
      var end = [base[0] + cut.d[0] * L + cut.n[0] * lean * 34,
                 base[1] + cut.d[1] * L + cut.n[1] * lean * 34];
      spurs.push('M' + pt(base) + 'L' + pt(mid) + 'L' + pt(end));
    }

    [['0', '#000'], ['0.24', '#fff'], ['0.6', '#fff'], ['0.88', '#4a4a4a'], ['1', '#000']].forEach(function (st) {
      var stop = document.createElementNS(NS, 'stop');
      stop.setAttribute('offset', st[0]);
      stop.setAttribute('stop-color', st[1]);
      grad.appendChild(stop);
    });
    defs.appendChild(grad);
    var mk = document.createElementNS(NS, 'mask');
    mk.setAttribute('id', mid2);
    mk.setAttribute('maskUnits', 'userSpaceOnUse');
    mk.setAttribute('x', -pad); mk.setAttribute('y', -pad);
    mk.setAttribute('width', W + pad * 2); mk.setAttribute('height', H + pad * 2);
    var mr = document.createElementNS(NS, 'rect');
    mr.setAttribute('x', -pad); mr.setAttribute('y', -pad);
    mr.setAttribute('width', W + pad * 2); mr.setAttribute('height', H + pad * 2);
    mr.setAttribute('fill', 'url(#' + gid + ')');
    mk.appendChild(mr);
    defs.appendChild(mk);

    /* 掃過去的剪裁框：讓整組圖層跟著劍鋒同時現形。
       clipPath 不吃 <g>，所以位移與旋轉都直接寫在 rect 的 CSS transform 上 */
    var ang = Math.atan2(cut.d[1], cut.d[0]) * 180 / Math.PI;
    if (tMax < tMin) ang += 180;
    var span = Math.abs(tMax - tMin);
    var cid = 'riteClip' + idx;
    var cp = document.createElementNS(NS, 'clipPath');
    cp.setAttribute('id', cid);
    cp.setAttribute('clipPathUnits', 'userSpaceOnUse');
    var cr = document.createElementNS(NS, 'rect');
    cr.setAttribute('class', 'sweep');
    cr.setAttribute('x', '0'); cr.setAttribute('y', '-300');
    cr.setAttribute('width', span.toFixed(1)); cr.setAttribute('height', '600');
    cr.style.setProperty('--sx', a[0].toFixed(1) + 'px');
    cr.style.setProperty('--sy', a[1].toFixed(1) + 'px');
    cr.style.setProperty('--sa', ang.toFixed(2) + 'deg');
    cp.appendChild(cr);
    defs.appendChild(cp);

    var g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'crack');
    g.setAttribute('mask', 'url(#' + mid2 + ')');

    var inner = document.createElementNS(NS, 'g');
    inner.setAttribute('clip-path', 'url(#' + cid + ')');
    /* rimglow 與 rim 描的是 tear 同一條紡錘外框，所以裂口上下正好各一道發光邊 */
    [['aura', 54], ['tear', 22], ['rift', 14], ['rimglow', 22], ['rim', 22], ['flare', 26]].forEach(function (L) {
      var path = document.createElementNS(NS, 'path');
      path.setAttribute('class', L[0]);
      path.setAttribute('d', spindle(L[1]));
      inner.appendChild(path);
    });
    spurs.forEach(function (sd) {
      var path = document.createElementNS(NS, 'path');
      path.setAttribute('class', 'spur');
      path.setAttribute('d', sd);

      g: g, sweep: cr, on: on, tMin: tMin, tMax: tMax, offs: offs, steps: steps,

  /* 蜂雲：一群飛出去的小劍 */
  var beeCount = W < 560 ? 20 : 30;
  var far = Math.max(W, H);
  var spread = Math.min(W, H) * .3;
  for (var b = 0; b < beeCount; b++) {
    var bee = document.createElement('div');
    bee.className = 'rite-bee';

    var oa = (base + (rand() - .5) * 40) * Math.PI / 180;
    var od = spread * (.16 + Math.pow(rand(), .7) * .9);

    bee.style.setProperty('--oy', (Math.sin(oa) * od).toFixed(1) + 'px');

    var dir = rand() < .2 ? rand() * 360 : base + (rand() - .5) * 150;
    bee.style.setProperty('--a', dir.toFixed(1) + 'deg');
    bee.style.setProperty('--curve', ((rand() - .5) * 34).toFixed(1) + 'deg');
    /* 飛行距離夠出畫面就好；太遠會在四成進度時就全部跑光，反而看不到 */
    bee.style.setProperty('--r', (far * (.58 + rand() * .6)).toFixed(0) + 'px');
    bee.style.setProperty('--tilt', ((rand() - .5) * 18).toFixed(1) + 'deg');
    /* 大小差距拉大，遠近層次才出得來 */
    bee.style.setProperty('--bs', (.85 + Math.pow(rand(), 1.1) * 1.05).toFixed(2));
    bee.style.setProperty('--qi', (far * (.06 + rand() * .16)).toFixed(0) + 'px');
    /* 速度與出手時機都錯開，才不會整群像同一個零件在動 */
    bee.style.setProperty('--bd', (520 + rand() * 520).toFixed(0) + 'ms');
    bee.style.setProperty('--bdelay', (Math.pow(rand(), 1.4) * 230).toFixed(0) + 'ms');

  }

  /* 命中時沿刀口迸出的火星 */

    for (var i = 0; i < count; i++) {

      var el = document.createElement('div');
      el.className = 'rite-spark';
      el.style.left = p[0].toFixed(1) + 'px';
      el.style.top = p[1].toFixed(1) + 'px';
      el.style.setProperty('--sa', (nAng + 90 + (rand() < .5 ? 0 : 180) + (rand() - .5) * 54).toFixed(1) + 'deg');
      el.style.setProperty('--sr', (40 + rand() * 130).toFixed(0) + 'px');
      el.style.setProperty('--sd', (300 + rand() * 220).toFixed(0) + 'ms');
      el.style.setProperty('--sdl', (rand() * 70).toFixed(0) + 'ms');
      sparkBox.appendChild(el);
    }

  function pulse(cls) {
    rite.classList.remove(cls);
    void rite.offsetWidth;
    rite.classList.add(cls);
  }

  var SPEED = 1, sm = /[?&]speed=([\d.]+)/.exec(location.search);

    window.setInterval(function () {
      document.getAnimations().forEach(function (a) { a.playbackRate = 1 / SPEED; });

     CSS 與 JS 的時間軸才不會錯開。 */
  function run() {
    try {
      build();
    } catch (err) {
      /* 幾何算壞了就直接放行，不要讓遮罩卡住整頁 */
      dismiss();
      return;
    }
    rite.classList.add('ignite');

    var fm = /[?&]frame=(\d+)/.exec(location.search);
    if (fm && document.getAnimations) {

      }, parseInt(fm[1], 10));

    /* 三刀節奏越來越快，最後一刀最重 */

      at(S[0], function () {
        var c = crackEls[i];
        c.g.classList.add('cut');
        c.sweep.classList.add('go');
        sparks(c, S[1]);
        rite.style.setProperty('--fx', (c.mid[0] / W * 100).toFixed(1) + '%');
        rite.style.setProperty('--fy', (c.mid[1] / H * 100).toFixed(1) + '%');

    at(1460, function () {

  function kick() {
    requestAnimationFrame(function () { requestAnimationFrame(go); });
    /* 背景分頁不會觸發 rAF，用計時器保底，否則遮罩會一直蓋住頁面 */
    window.setTimeout(go, 500);
  }

  } else {
    kick();
  }
  /* 最後的保險：無論發生什麼事，六秒後一定放行 */
  if (!/[?&]frame=/.test(location.search)) {

  }

  function skip() {
    timers.forEach(clearTimeout);
    timers = [];

  }

(function () {
  "use strict";
  var themeToggle = document.getElementById('theme-toggle');
  function syncThemeControl() {
    if (!themeToggle) return;
    var dark = document.documentElement.dataset.theme === 'dark';
    themeToggle.title = dark ? '切換至淺色模式' : '切換至深色模式';
    themeToggle.setAttribute('aria-label', themeToggle.title);
    themeToggle.querySelector('.theme-icon').textContent = dark ? '☀' : '☾';
    themeToggle.querySelector('.theme-label').textContent = dark ? '淺色' : '深色';
  }
  if (themeToggle) themeToggle.addEventListener('click', function () {

  });
  syncThemeControl();
  var PER_COURT = 7;
  var GROUPS = [
    { k: 'going', label: '確認參加', emoji: '✅', cls: 'p-jade', dot: '#9BC3AE', color: 'var(--jade-300)' },
    { k: 'maybe', label: '不確定', emoji: '❓', cls: 'p-gold', dot: '#C9A961', color: 'var(--gold)' },
    { k: 'wait', label: '候補', emoji: '⏳', cls: 'p-violet', dot: '#9E8FC0', color: 'var(--amethyst)' }

  var RULES = [
    '🚫 禁止遲到：我們人本就不多，遲到會浪費場地與時間，再犯團長會調整場次',
    '🚫 禁止勝負魔人：開心流汗為主，輸贏放輕鬆，殺球前看一下對面是不是新手 🙏',
    '🚫 禁止換球魔人：球還能打就別一直喊換球',
    '🏸 換球規則：所有球統一拿到團長平板旁更換，一顆舊球換一顆新球，方便統計用球量與費用，請勿自行從球筒拿新球',
    '🔄 輪場規則：以平衡強弱或隨機為原則；要自行更動請至平板調整，一律從當前排場最後一組去調整，不要直接往前拉影響球友次序',
    '⏰ 準時報到：臨時無法到請提早告知，方便結算分攤',
    '👟 鞋款限制：為了安全請穿羽球鞋，非羽球鞋恕無法上場 🙏',
    '🗑️ 場館整潔：垃圾請自行分類處理'
  ];

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  var PATHS = {
    clock: '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    dollar: '<line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
    list: '<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
    alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
    share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/>'
  };
  function ic(n, s) {
    s = s || 13;
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + PATHS[n] + '</svg>';
  }
  function dateParts(t) {
    t = String(t || '').trim();
    var md = t.match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})/);
    var wd = t.match(/[（(]\s*([^）)]+?)\s*[）)]/);
    return { m: md ? md[1] + '月' : '', d: md ? md[2] : (t.slice(0, 2) || '—'), w: wd ? wd[1] : '' };
  }
  function parseRule(s) {
    var t = String(s).trim(), g = '';
    var m = t.match(/^([\p{Extended_Pictographic}☀-➿][️‍\p{Extended_Pictographic}]*)\s*/u);
    if (m) { g = m[1]; t = t.slice(m[0].length); }
    var i = t.indexOf('：');
    if (i > 0 && i <= 8) return { g: g, t: t.slice(0, i), b: t.slice(i + 1) };
    return { g: g, t: '', b: t };
  }
  function notesOf(ev) {
    if (!ev.note) return [];
    return String(ev.note).split(/[｜|]/).map(function (t) { return t.trim(); }).filter(Boolean);
  }
  function flow(v, cap) { var c=Math.max(1,cap),pct=Math.min(100,Math.round((v/c)*100)),over=v>c,near=!over&&pct>=80;var grad=over?'linear-gradient(90deg,#B85446 0%,#E0958A 100%)':(near?'linear-gradient(90deg,#3D6555 0%,#9BC3AE 58%,#D9BC6D 100%)':'linear-gradient(90deg,#3D6555 0%,#6E9E88 48%,#9BC3AE 100%)');var glow=over?'rgba(208,122,108,.7)':(near?'rgba(201,169,97,.65)':'rgba(155,195,174,.55)');return '<div class="flow'+(v===0?' is-empty':'')+(near?' is-near':'')+(pct>=100&&!over?' is-full':'')+'"><i style="width:'+pct+'%;background-image:'+grad+';background-size:100% 100%;--flow-glow:'+glow+'"></i></div>'; }
  function realmOf(level){var lv=Number(level)||1;return lv>=8?{k:'transcendent',label:'化神'}:lv>=7?{k:'nascent',label:'元嬰'}:lv>=5?{k:'golden',label:'結丹'}:lv>=3?{k:'foundation',label:'築基'}:{k:'qi',label:'練氣'};}
  function realmBadge(level){var r=realmOf(level);return '<span class="realm-badge realm-'+r.k+'" aria-label="'+r.label+'，程度 '+Number(level||0)+'">'+r.label+'<span class="num">'+Number(level||0)+'</span></span>';}
  function countup(n){return '<span class="countup" data-count-to="'+Number(n||0)+'">'+Number(n||0)+'</span>';}

  function groupHtml(g, list, eventIndex) {
    var h = '<details class="grp disclosure" data-disclosure="roster-' + eventIndex + '-' + g.k + '"><summary><span class="grp-h">' +
      '<span class="dot" style="background:' + g.dot + '"></span>' +
      '<span class="name" style="color:' + g.color + '">' + g.emoji + ' ' + g.label + '</span>' +
      '<span class="pill ' + g.cls + '">' + list.length + '</span></span></summary>';
    if (!list.length) return h + '<p class="none disclosure-body">目前沒有人</p></details>';
    h += '<ol class="names disclosure-body">';
    list.forEach(function (r, i) {
      var f = r.gender === 'female';
      h += '<li style="--entry-delay:' + Math.min(i * 28, 220) + 'ms"><span class="i">' + (i + 1) + '</span>' + '<span class="nm">' + esc(r.nickname) + '</span>' + (r.level ? realmBadge(r.level) : '') + '</li>';
    });
    return h + '</ol></details>';
  }

  function eventHtml(ev, eventIndex) {
    var roster = ev.roster || [];
    var cap = (Number(ev.courts) || 0) * PER_COURT;
    var groups = {};
    GROUPS.forEach(function (g) {
      groups[g.k] = roster.filter(function (r) { return r.status === g.k; });
    });
    var going = groups.going.length;
    var over = going > cap;
    var full = !over && cap > 0 && going >= cap;
    var pct = Math.min(100, Math.round((going / Math.max(1, cap)) * 100));
    var male = groups.going.filter(function (r) { return r.gender !== 'female'; }).length;
    var dp = dateParts(ev.dateText);

    var h = '<section class="card event-card">' + (full ? '<span class="full-seal" aria-label="額滿">額滿</span>' : '');
    h += '<div class="ev-head">' +
      '<span class="seal"><span class="d">' + esc(dp.d) + '</span><span class="m">' + esc(dp.m) + '</span>' +
      (dp.w ? '<span class="w">' + esc(dp.w) + '</span>' : '') + '</span>' +
      '<span style="min-width:0;flex:1">' +
      '<h2 class="ev-title disp brush">' + esc(ev.title) + '</h2>' +
      '<span class="meta">' +
      '<span>' + ic('clock') + '<span class="num">' + esc(ev.startTime) + '–' + esc(ev.endTime) + '</span></span>' +
      '<span>' + ic('pin') + esc(ev.place) + '</span>' +
      '<span>' + ic('dollar') + '<span class="num">$' + esc(ev.fee) + ' / 人</span></span>' +
      '</span></span>' +
      '<span class="pill ' + (over ? 'p-red' : 'p-jade') + '">' + ic('users', 11) +
      '<span class="num">' + going + ' / ' + cap + '</span></span>' +
      '</div>';
    h += '<div class="action-row"><button type="button" class="share" data-event="' + eventIndex + '" aria-label="分享 ' + esc(ev.title) + '">' + ic('share', 14) + '<span>分享本場佈告</span></button>' +
      '<span class="recruit">◌ 名單由長老統一維護</span></div>';

    h += '<div class="stats">' +
      '<div class="stat-main"' + (over ? ' style="border-color:rgba(208,122,108,.24);background:linear-gradient(150deg,rgba(208,122,108,.10),rgba(228,235,232,.012))"' : '') + '>' +
      '<div class="l"' + (over ? ' style="color:var(--cinnabar)"' : '') + '>✅ 確認參加</div>' +
      '<div class="qi-ring" style="--qi:' + pct + '%"><span>' + pct + '%</span></div>' +
      '<div class="v"><span class="big"' + (over ? ' style="color:var(--cinnabar)"' : '') + '>' + countup(going) + '</span>' +
      '<span class="of">／ ' + cap + ' 人　<span style="font-size:.8rem">男 ' + male + '　女 ' + (going - male) + '</span></span></div>' +
      '<div class="prog-h" style="margin-top:1.1rem"><span>報名進度</span><span class="num" style="color:' + (over ? 'var(--cinnabar)' : 'var(--jade-300)') + ';font-weight:600">' +
      (over ? '超出 ' + (going - cap) + ' 人' : pct + '%') + '</span></div>' + flow(going, cap) +
      '<p class="num" style="margin:.8rem 0 0;font-size:.7rem;color:var(--mist-3)">' + esc(ev.courts) + ' 面場 × ' + PER_COURT + ' 人 ＝ 上限 ' + cap + ' 人</p>' +
      '</div><div class="stat-side">';
    GROUPS.slice(1).forEach(function (g) {
      var n = groups[g.k].length;
      h += '<div class="stat-row inlay"><span style="color:' + g.color + ';font-size:.78rem;font-weight:600">' +
        g.emoji + ' ' + g.label + '</span><span class="n" style="color:' + (n > 0 ? g.color : 'var(--mist-3)') + '">' + n + '</span></div>';
    });
    h += '</div></div>';

    if (over) {
      h += '<div class="warn">' + ic('alert', 14) + '確認人數已超過場地上限 ' + (going - cap) + ' 人</div>';
    }

    var notes = notesOf(ev);
    h += '<div class="split">' +
      '<details class="box inlay event-info" data-disclosure="info-' + eventIndex + '" open><summary>' + ic('pin', 14) + '地點資訊</summary><div class="event-info-body"><div class="info">' +
      '<div class="row"><span class="ic">' + ic('pin', 14) + '</span><span><span class="k">球館地點</span><span class="v">' + esc(ev.place) + '</span></span></div>' +
      '<div class="row"><span class="ic">' + ic('clock', 14) + '</span><span><span class="k">時間</span><span class="v num">' + esc(ev.startTime) + ' – ' + esc(ev.endTime) + '</span></span></div>' +
      '<div class="row"><span class="ic">' + ic('users', 14) + '</span><span><span class="k">場地</span><span class="v">' + esc(ev.courts) + ' 面場（上限 ' + cap + ' 人）</span></span></div>' +
      '<div class="row"><span class="ic">' + ic('dollar', 14) + '</span><span><span class="k">費用</span><span class="v">$' + esc(ev.fee) + ' / 人（均分預估，多補少退）</span></span></div>' +
      '</div>';
    if (ev.venue && (ev.venue.address || ev.venue.parking || ev.venue.facilities || ev.venue.mapUrl)) {
      h += '<div class="venue-extra">' + (ev.venue.address ? '<div>地址｜' + esc(ev.venue.address) + '</div>' : '') +
        (ev.venue.parking ? '<div>停車｜' + esc(ev.venue.parking) + '</div>' : '') +
        (ev.venue.facilities ? '<div>設施｜' + esc(ev.venue.facilities) + '</div>' : '') +
        (ev.venue.mapUrl ? '<a href="' + esc(ev.venue.mapUrl) + '" target="_blank" rel="noopener">開啟地圖導航 →</a>' : '') + '</div>';
    }
    if (notes.length) {
      h += '<ul class="notes"><li class="lbl" style="display:block">補充事項</li>';
      notes.forEach(function (t) { h += '<li>' + esc(t) + '</li>'; });
      h += '</ul>';
    }
    h += '</div></div></details>';

    h += '<details class="box inlay disclosure" data-disclosure="rules-' + eventIndex + '"><summary>' + ic('list', 14) + '團規・展開查看</summary><div class="disclosure-body">';
    RULES.forEach(function (raw) {
      var r = parseRule(raw);
      h += '<div class="rule"><span class="g">' + r.g + '</span><span class="copy">' +
        (r.t ? '<span class="t" style="display:block">' + esc(r.t) + '</span>' : '') +
        '<span class="b" style="display:block">' + esc(r.b) + '</span></span></div>';
    });
    h += '</div></details></div>';

    if (!roster.length) {
      h += '<div class="empty">名單還沒開始排，等管理者更新。</div>';
    } else {
      h += '<div class="roster-h"><div><span class="eyebrow">出席名單</span>' +
        '<p class="n">' + roster.length + '<small>人在列</small></p></div>' +
        '<span style="font-size:.7rem;color:var(--mist-3)">依狀態分組</span></div>';
      GROUPS.forEach(function (g) { h += groupHtml(g, groups[g.k], eventIndex); });
    }
    return h + '</section>';
  }

  var lastVersion = null, lastData = null;
  var live = !!document.querySelector('meta[name="club-live"]');
  function revealCards() {
    var cards = Array.from(document.querySelectorAll('.event-card'));
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) { cards.forEach(function (x) { x.classList.add('reveal-in'); }); return; }
    var observer = new IntersectionObserver(function (entries) { entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('reveal-in'); observer.unobserve(e.target); } }); }, { threshold:.08 });
    cards.forEach(function (x) { x.classList.add('reveal-wait'); observer.observe(x); });
  }
  function bindCardAura(){if(matchMedia('(prefers-reduced-motion: reduce)').matches||!matchMedia('(hover:hover) and (pointer:fine)').matches)return;document.querySelectorAll('.event-card').forEach(function(card){card.addEventListener('pointermove',function(ev){var b=card.getBoundingClientRect(),x=(ev.clientX-b.left)/b.width,y=(ev.clientY-b.top)/b.height;card.style.setProperty('--mx',(x*100)+'%');card.style.setProperty('--my',(y*100)+'%');card.style.setProperty('--rx',((.5-y)*3.2)+'deg');card.style.setProperty('--ry',((x-.5)*3.2)+'deg');});card.addEventListener('pointerleave',function(){card.style.removeProperty('--rx');card.style.removeProperty('--ry');});});}
  function animateCounters(){var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;document.querySelectorAll('.countup').forEach(function(node){var end=Number(node.dataset.countTo)||0;if(reduce){node.textContent=end;return;}var start=performance.now(),duration=320;function step(now){var t=Math.min(1,(now-start)/duration),eased=1-Math.pow(1-t,3);node.textContent=Math.round(end*eased);if(t<1)requestAnimationFrame(step);}requestAnimationFrame(step);});}
  function disclosureState(){return Array.from(document.querySelectorAll('[data-disclosure][open]')).map(function(node){return node.getAttribute('data-disclosure');});}
  function restoreDisclosures(opened){var mobile=matchMedia('(max-width:639px)').matches;document.querySelectorAll('[data-disclosure]').forEach(function(node){var key=node.getAttribute('data-disclosure'), wasOpen=opened.indexOf(key)>=0, shouldOpen=node.classList.contains('event-info')?(!mobile||wasOpen):wasOpen;if(shouldOpen)node.setAttribute('open','');else node.removeAttribute('open');});}
  async function render() {
    if (live && document.hidden && lastData) { setTimeout(render, 5000); return; }
    var app = document.getElementById('app'), stamp = document.getElementById('stamp'), data;
    try {
      if (live) {
        var response = await fetch('/api/public', { cache: 'no-store', signal: AbortSignal.timeout(10000) });
        if (!response.ok) throw new Error('讀取失敗');
        data = await response.json();
      } else data = JSON.parse(document.getElementById('snapshot').textContent);
      if (!Array.isArray(data.events)) throw new Error('格式不正確');
      var d = new Date(data.generatedAt);
      stamp.textContent = '名單更新於 ' + (isNaN(d.getTime()) ? '未知時間' : d.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false })) + (live ? '・每 5 秒同步' : '・歷史快照');
      if (!lastData || lastVersion !== data.version) {
        var opened = disclosureState();
        stamp.classList.remove('sync-flash'); void stamp.offsetWidth; stamp.classList.add('sync-flash');
        app.innerHTML = data.events.length ? data.events.map(eventHtml).join('') : '<div class="empty">目前沒有開團。</div>';
        app.innerHTML += '<div class="foot"><strong>' + (live ? '公開名單會自動更新。' : '這是歷史快照，尚未連上共用後端。') + '</strong><br>名單與活動資訊由長老及管理員統一維護；如需異動請聯絡管理者。</div>';
        restoreDisclosures(opened);
        revealCards(); bindCardAura(); animateCounters();
        var sync=document.getElementById('sync-indicator');if(sync){sync.classList.remove('sync-pulse');void sync.offsetWidth;sync.classList.add('sync-pulse');}
      }
      lastData = data; lastVersion = data.version;
    } catch (e) {
      stamp.textContent = lastData ? '連線中斷，顯示上次載入的名單；正在重試…' : '無法取得最新名單，正在重試…';
      if (!lastData) app.innerHTML = '<div class="empty" role="alert">名單暫時無法讀取，請稍後再試或聯絡管理者。</div>';
    } finally { if (live) setTimeout(render, 5000); }
  }

  document.addEventListener('click', async function (ev) {
    var share = ev.target.closest('[data-event]');
    if (!share || !lastData) return;
    var row = lastData.events[Number(share.getAttribute('data-event'))];
    if (!row) return;
    var attending = (row.roster || []).filter(function (r) { return r.status === 'going'; }).length;
    var message = '【' + row.dateText + ' ' + row.title + '】\n' + row.startTime + '–' + row.endTime + '\n' + row.place + '\n$' + row.fee + ' / 人・目前 ' + attending + ' 人\n' + location.href;
    try {
      if (navigator.share) await navigator.share({ title:row.title, text:message, url:location.href });
      else { await navigator.clipboard.writeText(message); share.querySelector('span').textContent = '已複製佈告'; setTimeout(function () { share.querySelector('span').textContent = '分享本場佈告'; }, 2500); }
    } catch (error) { if (error.name !== 'AbortError') share.querySelector('span').textContent = '請手動複製網址'; }
  });


  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);
  else render();
})();
</script>
